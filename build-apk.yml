name: Build L.E.B-M APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="."
          elif [ -f "MusicPlayer/settings.gradle" ] || [ -f "MusicPlayer/settings.gradle.kts" ]; then
            PROJECT_DIR="MusicPlayer"
          else
            echo "ERROR: No se encontro settings.gradle"
            find . -maxdepth 3
            exit 1
          fi
          echo "Compilando proyecto en: $PROJECT_DIR"
          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
            (cd "$PROJECT_DIR" && ./gradlew assembleDebug --stacktrace)
          else
            gradle -p "$PROJECT_DIR" assembleDebug --stacktrace
          fi
          mkdir -p dist
          APK_FILE=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -name "*.apk" | head -n 1)
          cp "$APK_FILE" dist/LEB-M-1.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: LEB-M-1.1-apk
          path: dist/LEB-M-1.1.apk
          if-no-files-found: error
