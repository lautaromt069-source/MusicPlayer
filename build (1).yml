name: Build L.E.B-M 1.5-beta

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create project (todo el codigo de la app viene en este archivo)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p leb
          cd leb
          mkdir -p "$(dirname 'settings.gradle')"
          cat > 'settings.gradle' << 'LEB_EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "MusicPlayer"
          include(":app")
          LEB_EOF
          mkdir -p "$(dirname 'build.gradle')"
          cat > 'build.gradle' << 'LEB_EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          LEB_EOF
          mkdir -p "$(dirname 'gradle.properties')"
          cat > 'gradle.properties' << 'LEB_EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          LEB_EOF
          mkdir -p "$(dirname 'app/build.gradle')"
          cat > 'app/build.gradle' << 'LEB_EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.leb.player'
              compileSdk 34
              defaultConfig {
                  applicationId "com.leb.player"
                  minSdk 26
                  targetSdk 34
                  versionCode 5
                  versionName "1.5-beta"
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.media3:media3-exoplayer:1.3.1'
              implementation 'androidx.media3:media3-session:1.3.1'
              implementation 'com.google.mlkit:translate:17.0.3'
          }
          LEB_EOF
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' << 'LEB_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <application
                  android:label="L.E.B"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <service android:name=".PlaybackService" android:exported="true" android:foregroundServiceType="mediaPlayback">
                      <intent-filter>
                          <action android:name="androidx.media3.session.MediaSessionService"/>
                      </intent-filter>
                  </service>
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          LEB_EOF
          mkdir -p "$(dirname 'app/src/main/res/drawable/ic_launcher_background.xml')"
          cat > 'app/src/main/res/drawable/ic_launcher_background.xml' << 'LEB_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <gradient android:startColor="#2A1170" android:endColor="#05010F" android:angle="270"/>
          </shape>
          LEB_EOF
          mkdir -p "$(dirname 'app/src/main/res/drawable/ic_launcher_foreground.xml')"
          cat > 'app/src/main/res/drawable/ic_launcher_foreground.xml' << 'LEB_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:pathData="M54,54 m-29,0 a29,29 0 1,0 58,0 a29,29 0 1,0 -58,0" android:strokeColor="#B9A8FF" android:strokeWidth="2.5" android:fillColor="#00000000"/>
              <path android:pathData="M36,47 L36,61" android:strokeColor="#FFFFFF" android:strokeWidth="6" android:strokeLineCap="round"/>
              <path android:pathData="M45,38 L45,70" android:strokeColor="#8B6CFF" android:strokeWidth="6" android:strokeLineCap="round"/>
              <path android:pathData="M54,30 L54,78" android:strokeColor="#FFFFFF" android:strokeWidth="6" android:strokeLineCap="round"/>
              <path android:pathData="M63,40 L63,68" android:strokeColor="#FF5CA8" android:strokeWidth="6" android:strokeLineCap="round"/>
              <path android:pathData="M72,48 L72,60" android:strokeColor="#FFFFFF" android:strokeWidth="6" android:strokeLineCap="round"/>
          </vector>
          LEB_EOF
          mkdir -p "$(dirname 'app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml')"
          cat > 'app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml' << 'LEB_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
              <monochrome android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          LEB_EOF
          mkdir -p "$(dirname 'app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml')"
          cat > 'app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml' << 'LEB_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
              <monochrome android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          LEB_EOF
          mkdir -p "$(dirname 'app/src/main/java/com/leb/player/PlaybackService.kt')"
          cat > 'app/src/main/java/com/leb/player/PlaybackService.kt' << 'LEB_EOF'
          package com.leb.player

          import androidx.media3.common.AudioAttributes
          import androidx.media3.common.C
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.session.MediaSession
          import androidx.media3.session.MediaSessionService

          class PlaybackService : MediaSessionService() {
              private var session: MediaSession? = null

              override fun onCreate() {
                  super.onCreate()
                  val player = ExoPlayer.Builder(this)
                      .setAudioAttributes(AudioAttributes.DEFAULT, true)
                      .setHandleAudioBecomingNoisy(true)
                      .setWakeMode(C.WAKE_MODE_LOCAL)
                      .build()
                  session = MediaSession.Builder(this, player).build()
              }

              override fun onGetSession(controllerInfo: MediaSession.ControllerInfo): MediaSession? = session

              override fun onDestroy() {
                  session?.run { player.release(); release() }
                  session = null
                  super.onDestroy()
              }
          }
          LEB_EOF
          mkdir -p "$(dirname 'app/src/main/java/com/leb/player/Lyrics.kt')"
          cat > 'app/src/main/java/com/leb/player/Lyrics.kt' << 'LEB_EOF'
          package com.leb.player

          import android.content.Context
          import android.net.Uri
          import android.provider.DocumentsContract
          import org.json.JSONArray
          import java.net.HttpURLConnection
          import java.net.URL

          object Lyrics {
              data class Line(val timeMs: Long, val text: String)

              private val timeRe = Regex("""\[(\d{1,3}):(\d{2})(?:[.:](\d{1,3}))?]""")
              private val tagRe = Regex("""^\[[A-Za-z]{2,}:.*]$""")

              /** Devuelve las líneas y si traen tiempos (formato .lrc). */
              fun parse(raw: String): Pair<List<Line>, Boolean> {
                  val out = ArrayList<Line>()
                  var synced = false
                  for (row in raw.lines()) {
                      val ms = timeRe.findAll(row).toList()
                      if (ms.isEmpty()) {
                          val t = row.trim()
                          if (!tagRe.matches(t)) out.add(Line(-1, t))
                          continue
                      }
                      synced = true
                      val text = timeRe.replace(row, "").trim()
                      for (m in ms) {
                          val fr = m.groupValues[3]
                          val frMs = if (fr.isEmpty()) 0L else fr.padEnd(3, '0').take(3).toLong()
                          out.add(Line(m.groupValues[1].toLong() * 60000 + m.groupValues[2].toLong() * 1000 + frMs, text))
                      }
                  }
                  if (synced) { out.removeAll { it.timeMs < 0 }; out.sortBy { it.timeMs } }
                  else { while (out.isNotEmpty() && out.last().text.isBlank()) out.removeAt(out.size - 1) }
                  return Pair(out, synced)
              }

              private fun norm(s: String) = s.lowercase().filter { it.isLetterOrDigit() }

              /** Busca un .lrc o .txt dentro de la carpeta elegida (y sus subcarpetas) por el nombre de la canción. */
              fun findInTree(ctx: Context, tree: Uri, title: String, artist: String, keyword: String): String? {
                  val tn = norm(title)
                  if (tn.length < 2) return null
                  val ids = ArrayList<String>()
                  ids.add(DocumentsContract.getTreeDocumentId(tree))
                  var i = 0
                  var lrc: Uri? = null
                  var txt: Uri? = null
                  while (i < ids.size && i < 300 && lrc == null) {
                      val id = ids[i++]
                      val kids = DocumentsContract.buildChildDocumentsUriUsingTree(tree, id)
                      ctx.contentResolver.query(kids, arrayOf(DocumentsContract.Document.COLUMN_DOCUMENT_ID, DocumentsContract.Document.COLUMN_DISPLAY_NAME, DocumentsContract.Document.COLUMN_MIME_TYPE), null, null, null)?.use { c ->
                          while (c.moveToNext()) {
                              val did = c.getString(0) ?: continue
                              val name = c.getString(1) ?: ""
                              if ((c.getString(2) ?: "") == DocumentsContract.Document.MIME_TYPE_DIR) { ids.add(did); continue }
                              val low = name.lowercase()
                              val isLrc = low.endsWith(".lrc")
                              if (!isLrc && !low.endsWith(".txt")) continue
                              if (keyword.isNotBlank() && !low.contains(keyword.lowercase())) continue
                              val base = norm(name.substringBeforeLast('.'))
                              if (base.contains(tn) || (base.length > 3 && tn.contains(base))) {
                                  val u = DocumentsContract.buildDocumentUriUsingTree(tree, did)
                                  if (isLrc) lrc = u else if (txt == null) txt = u
                              }
                          }
                      }
                  }
                  val pick = lrc ?: txt ?: return null
                  return ctx.contentResolver.openInputStream(pick)?.bufferedReader()?.use { it.readText() }
              }

              /** Busca la letra en internet (LRCLIB). Prefiere la versión con tiempos. */
              fun fetchOnline(title: String, artist: String): String? {
                  return try {
                      var q = "https://lrclib.net/api/search?track_name=" + Uri.encode(title)
                      if (artist != "Artista desconocido") q += "&artist_name=" + Uri.encode(artist)
                      val c = URL(q).openConnection() as HttpURLConnection
                      c.setRequestProperty("User-Agent", "LEB-Player/1.2")
                      c.connectTimeout = 8000; c.readTimeout = 8000
                      val arr = JSONArray(c.inputStream.bufferedReader().use { it.readText() })
                      var plain: String? = null
                      for (i in 0 until arr.length()) {
                          val o = arr.getJSONObject(i)
                          val s = o.optString("syncedLyrics", "")
                          if (s.isNotBlank() && s != "null") return s
                          val p = o.optString("plainLyrics", "")
                          if (plain == null && p.isNotBlank() && p != "null") plain = p
                      }
                      plain
                  } catch (e: Exception) { null }
              }
          }
          LEB_EOF
          mkdir -p "$(dirname 'app/src/main/java/com/leb/player/NatureIntro.kt')"
          cat > 'app/src/main/java/com/leb/player/NatureIntro.kt' << 'LEB_EOF'
          package com.leb.player

          import android.animation.Animator
          import android.animation.AnimatorListenerAdapter
          import android.animation.ValueAnimator
          import android.content.Context
          import android.graphics.*
          import android.view.View
          import android.view.animation.LinearInterpolator

          /** Intro animada de naturaleza (amanecer en el bosque) que termina con el logo L.E.B-M. */
          class NatureIntro(ctx: Context, private val logo: Bitmap) : View(ctx) {
              private var p = 0f
              private var anim: ValueAnimator? = null
              private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val rnd = java.util.Random(11)
              private val stars = Array(90) { floatArrayOf(rnd.nextFloat(), rnd.nextFloat() * 0.55f, 0.6f + rnd.nextFloat() * 1.6f) }
              private val trees = Array(26) { floatArrayOf(rnd.nextFloat(), 0.7f + rnd.nextFloat() * 0.9f, rnd.nextFloat() * 6.28f) }
              private val flies = Array(28) { floatArrayOf(rnd.nextFloat(), 0.55f + rnd.nextFloat() * 0.4f, rnd.nextFloat() * 6.28f) }

              /** Reproduce la animación desde [from] (0 = completa, 0.8 = solo el final con el logo). */
              fun play(from: Float, then: () -> Unit) {
                  anim?.cancel()
                  p = from
                  var cancelled = false
                  val a = ValueAnimator.ofFloat(from, 1f)
                  a.duration = ((1f - from) * 7500).toLong().coerceAtLeast(600L)
                  a.interpolator = LinearInterpolator()
                  a.addUpdateListener { p = it.animatedValue as Float; invalidate() }
                  a.addListener(object : AnimatorListenerAdapter() {
                      override fun onAnimationCancel(an: Animator) { cancelled = true }
                      override fun onAnimationEnd(an: Animator) { if (!cancelled) postDelayed({ then() }, 700) }
                  })
                  anim = a
                  post { a.start() }
              }

              override fun onDetachedFromWindow() { anim?.cancel(); super.onDetachedFromWindow() }

              private fun lerp(a: Int, b: Int, t: Float) = Color.rgb(
                  (Color.red(a) + (Color.red(b) - Color.red(a)) * t).toInt(),
                  (Color.green(a) + (Color.green(b) - Color.green(a)) * t).toInt(),
                  (Color.blue(a) + (Color.blue(b) - Color.blue(a)) * t).toInt())

              private fun ridge(c: Canvas, w: Float, h: Float, base: Float, amp: Float, freq: Float, color: Int, ph: Float) {
                  val path = Path(); path.moveTo(0f, h)
                  var x = 0f
                  while (x <= w + 8f) {
                      val y = h * (base - amp * (0.5f * Math.sin((x / w * freq * 3.14 + ph).toDouble()).toFloat() + 0.5f * Math.sin((x / w * freq * 7.3 + ph * 2).toDouble()).toFloat()))
                      path.lineTo(x, y); x += 8f
                  }
                  path.lineTo(w, h); path.close()
                  paint.color = color; paint.alpha = 255; c.drawPath(path, paint)
              }

              override fun onDraw(c: Canvas) {
                  val w = width.toFloat(); val h = height.toFloat()
                  if (w == 0f || h == 0f) return
                  val t = minOf(1f, p / 0.62f)
                  val tm = System.currentTimeMillis() % 100000L / 1000f
                  // cielo: de la noche al amanecer
                  paint.shader = LinearGradient(0f, 0f, 0f, h * 0.75f,
                      intArrayOf(lerp(Color.parseColor("#070B26"), Color.parseColor("#3B7BD4"), t), lerp(Color.parseColor("#1B2A5E"), Color.parseColor("#FFB27A"), t), lerp(Color.parseColor("#3A2A6E"), Color.parseColor("#FFE2A8"), t)),
                      floatArrayOf(0f, 0.7f, 1f), Shader.TileMode.CLAMP)
                  c.drawRect(0f, 0f, w, h, paint); paint.shader = null
                  // estrellas
                  paint.color = Color.WHITE
                  for (s in stars) { paint.alpha = ((1f - t) * 220).toInt().coerceIn(0, 255); c.drawCircle(s[0] * w, s[1] * h, s[2], paint) }
                  // sol
                  val sx = w * 0.7f; val sy = h * (0.80f - 0.30f * t)
                  paint.shader = RadialGradient(sx, sy, w * 0.5f, intArrayOf(Color.argb((200 * t).toInt(), 255, 214, 140), Color.TRANSPARENT), null, Shader.TileMode.CLAMP)
                  c.drawCircle(sx, sy, w * 0.5f, paint); paint.shader = null
                  paint.color = Color.rgb(255, 236, 190); paint.alpha = 255
                  c.drawCircle(sx, sy, w * 0.075f, paint)
                  // nubes
                  paint.color = Color.WHITE
                  for (i in 0 until 5) {
                      val cx = ((i * 0.27f + p * 0.35f) % 1.3f - 0.15f) * w; val cy = h * (0.12f + 0.07f * i)
                      paint.alpha = (90 + 60 * t).toInt()
                      c.drawOval(RectF(cx - w * 0.16f, cy - h * 0.018f, cx + w * 0.16f, cy + h * 0.018f), paint)
                      c.drawOval(RectF(cx - w * 0.09f, cy - h * 0.03f, cx + w * 0.07f, cy + h * 0.005f), paint)
                  }
                  // montañas
                  ridge(c, w, h, 0.62f, 0.10f, 3f, lerp(Color.parseColor("#141A3D"), Color.parseColor("#6E7FB8"), t), 1.3f)
                  ridge(c, w, h, 0.70f, 0.08f, 5f, lerp(Color.parseColor("#0F1530"), Color.parseColor("#3F5A8C"), t), 2.1f)
                  ridge(c, w, h, 0.80f, 0.05f, 7f, lerp(Color.parseColor("#0A0F24"), Color.parseColor("#1F3A52"), t), 0.4f)
                  // pinos
                  paint.color = lerp(Color.parseColor("#050814"), Color.parseColor("#0F2A1E"), t); paint.alpha = 255
                  for (tr in trees) {
                      val x = tr[0] * w; val base = h * 0.9f; val sc = tr[1] * h * 0.11f
                      val sway = Math.sin((tm * 1.2f + tr[2]).toDouble()).toFloat() * sc * 0.04f
                      for (k in 0 until 3) {
                          val yy = base - sc * (0.55f * k); val ww = sc * (0.55f - 0.13f * k)
                          val path = Path(); path.moveTo(x + sway * (k + 1), yy - sc * 0.9f); path.lineTo(x - ww, yy); path.lineTo(x + ww, yy); path.close()
                          c.drawPath(path, paint)
                      }
                  }
                  c.drawRect(0f, h * 0.9f, w, h, paint)
                  // luciérnagas
                  paint.color = Color.rgb(255, 245, 160)
                  for (f in flies) {
                      val a = (Math.sin((tm * 2f + f[2]).toDouble()).toFloat() * 0.5f + 0.5f) * (1f - t * 0.6f)
                      paint.alpha = (a * 230).toInt().coerceIn(0, 255)
                      c.drawCircle((f[0] + Math.sin((tm * 0.5f + f[2]).toDouble()).toFloat() * 0.03f) * w, f[1] * h, 3.2f, paint)
                  }
                  // pájaros
                  paint.style = Paint.Style.STROKE; paint.strokeWidth = 3f; paint.color = Color.argb(200, 20, 20, 30)
                  if (p > 0.25f) for (i in 0 until 5) {
                      val bx = ((p - 0.25f) * 1.1f + i * 0.07f) * w; val by = h * (0.2f + 0.04f * i) - p * 20f
                      val flap = Math.sin((tm * 8f + i).toDouble()).toFloat() * 8f
                      val pa = Path(); pa.moveTo(bx - 14f, by + flap); pa.quadTo(bx - 6f, by - 6f, bx, by); pa.quadTo(bx + 6f, by - 6f, bx + 14f, by + flap)
                      c.drawPath(pa, paint)
                  }
                  paint.style = Paint.Style.FILL
                  // logo final L.E.B-M
                  val q = ((p - 0.78f) / 0.22f).coerceIn(0f, 1f)
                  if (q > 0f) {
                      paint.color = Color.BLACK; paint.alpha = (q * 170).toInt(); c.drawRect(0f, 0f, w, h, paint)
                      val size = w * 0.5f * (0.75f + 0.25f * q); val cx = w / 2; val cy = h * 0.42f
                      paint.color = Color.WHITE; paint.alpha = (q * 255).toInt()
                      c.drawBitmap(logo, null, RectF(cx - size / 2, cy - size / 2, cx + size / 2, cy + size / 2), paint)
                      paint.textAlign = Paint.Align.CENTER; paint.textSize = w * 0.042f
                      c.drawText("Creado por Lautaro y Claude", cx, cy + size / 2 + w * 0.1f, paint)
                      paint.textAlign = Paint.Align.LEFT
                  }
              }
          }
          LEB_EOF
          mkdir -p "$(dirname 'app/src/main/java/com/leb/player/AnimeAI.kt')"
          cat > 'app/src/main/java/com/leb/player/AnimeAI.kt' << 'LEB_EOF'
          package com.leb.player

          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL

          /** IA musical de L.E.B-M Pro con 3 personalidades inspiradas en tipos de anime: Shōnen, Shōjo y Seinen. */
          object AnimeAI {
              data class Persona(val name: String, val type: String, val emoji: String, val color: String, val tagline: String, val style: String)

              val personas = listOf(
                  Persona("Kaito", "Shōnen", "⚔️", "#FF7A2F", "acción, energía y espíritu de lucha",
                      "Hablas como el protagonista de un anime shōnen de acción y aventuras: energético, motivador y directo, con frases de superación, rivalidad sana y fuerza de voluntad. Usas algún grito de ánimo ocasional como ¡Vamos! o ¡Con todo!."),
                  Persona("Hana", "Shōjo", "🌸", "#FF6FB5", "romance, emociones y detalles dulces",
                      "Hablas como la protagonista de un anime shōjo: dulce, empática, romántica y soñadora, muy atenta a los sentimientos. Tu tono es cálido y con algún detalle poético, como pétalos, atardeceres o estrellas."),
                  Persona("Ren", "Seinen", "🌙", "#6C8CFF", "calma, madurez y reflexión",
                      "Hablas como un personaje de anime seinen: sereno, maduro y reflexivo, algo melancólico, con frases breves y profundas y una ironía suave. Nada exagerado.")
              )

              fun greeting(p: Persona) = when (p.type) {
                  "Shōnen" -> "¡Soy Kaito! ¡Hoy entrenamos con buena música! ¿Qué ponemos primero?"
                  "Shōjo" -> "Hola, soy Hana 🌸 Cuéntame cómo va tu día y buscamos la canción perfecta."
                  else -> "Soy Ren. La música dice lo que las palabras callan. ¿Qué quieres escuchar?"
              }

              private fun system(p: Persona, library: List<String>) =
                  "Eres ${p.name}, la IA musical de la app L.E.B-M (creada por Lautaro y Claude). Tu estilo es el de un anime ${p.type}. ${p.style} " +
                      "Respondes siempre en español, en máximo 3 frases cortas y sin markdown. Eres un personaje original: no imites a personajes existentes ni digas que eres una persona real. " +
                      "Tu trabajo es conversar y recomendar música. Si recomiendas canciones de la biblioteca del usuario, escribe el título EXACTO entre «» (por ejemplo «Título»). " +
                      "Biblioteca del usuario (muestra):\n" + library.joinToString("\n")

              /** IA en línea (necesita clave de API e internet). Lanza excepción si algo falla. */
              fun ask(key: String, model: String, p: Persona, history: List<Pair<String, String>>, library: List<String>): String {
                  val msgs = JSONArray()
                  var lastRole = ""
                  for ((role, text) in history) {
                      if (role == lastRole && msgs.length() > 0) {
                          val o = msgs.getJSONObject(msgs.length() - 1)
                          o.put("content", o.getString("content") + "\n" + text)
                      } else msgs.put(JSONObject().put("role", role).put("content", text))
                      lastRole = role
                  }
                  val body = JSONObject().put("model", model).put("max_tokens", 400).put("system", system(p, library)).put("messages", msgs)
                  val c = URL("https://api.anthropic.com/v1/messages").openConnection() as HttpURLConnection
                  c.requestMethod = "POST"; c.doOutput = true; c.connectTimeout = 10000; c.readTimeout = 30000
                  c.setRequestProperty("content-type", "application/json")
                  c.setRequestProperty("x-api-key", key)
                  c.setRequestProperty("anthropic-version", "2023-06-01")
                  c.outputStream.use { it.write(body.toString().toByteArray()) }
                  val code = c.responseCode
                  val raw = (if (code in 200..299) c.inputStream else c.errorStream).bufferedReader().use { it.readText() }
                  if (code !in 200..299) throw Exception("error $code")
                  val arr = JSONObject(raw).getJSONArray("content")
                  val sb = StringBuilder()
                  for (i in 0 until arr.length()) { val o = arr.getJSONObject(i); if (o.optString("type") == "text") sb.append(o.optString("text")) }
                  val out = sb.toString().trim()
                  if (out.isEmpty()) throw Exception("respuesta vacía")
                  return out
              }

              /** Modo básico: respuestas de la personalidad sin internet y sin clave, recomendando de tu biblioteca. */
              fun offlineReply(p: Persona, userText: String, titles: List<String>): String {
                  val t = userText.lowercase()
                  if (titles.isEmpty()) return "Todavía no veo canciones en tu biblioteca. Dale permiso a la app y reescanea la música en Ajustes."
                  val picks = titles.shuffled().take(3).joinToString(", ") { "«$it»" }
                  val sad = listOf("triste", "mal", "llor", "solo", "deprim", "ansied").any { t.contains(it) }
                  val hype = listOf("energ", "ejerc", "gym", "correr", "ánimo", "animo", "fuerza", "fiesta", "motiv").any { t.contains(it) }
                  val hi = listOf("hola", "buenas", "hey", "qué tal", "que tal").any { t.contains(it) }
                  return when (p.type) {
                      "Shōnen" -> when {
                          hi -> "¡Hola! ¡Listo para darlo todo! Prueba con $picks."
                          sad -> "¡Nadie se rinde hoy! Levántate con $picks y sigue adelante."
                          hype -> "¡Eso es! ¡Con todo! Pon $picks y que no pare nada."
                          else -> "¡Vamos! Mi consejo de hoy: $picks."
                      }
                      "Shōjo" -> when {
                          hi -> "Hola 🌸 Qué lindo verte. ¿Te gustaría escuchar $picks?"
                          sad -> "Ven, no estás solo. Estas canciones te abrazan despacito: $picks."
                          hype -> "¡Qué bonito ánimo! Con $picks el día brilla más."
                          else -> "Creo que esto va con tu corazón hoy: $picks 🌸"
                      }
                      else -> when {
                          hi -> "Hola. Si buscas compañía, quizá $picks."
                          sad -> "A veces el silencio pesa. Deja que suene $picks."
                          hype -> "Energía, sí. Pero con calma: $picks."
                          else -> "Escucha esto sin prisa: $picks."
                      }
                  }
              }
          }
