              private fun refreshLyricsUi() {
                  lyAdapter.notifyDataSetChanged()
                  lyEmpty.text = lyStatus
                  lyEmpty.visibility = if (lyLines.isEmpty()) View.VISIBLE else View.GONE
                  if (lyLines.isEmpty()) pLine.text = ""
              }

              private fun setLyrics(raw: String) {
                  val (lines, synced) = Lyrics.parse(raw)
                  lyRaw = raw; lyLines = lines; lySynced = synced; lyTrans = arrayOfNulls(lines.size); lyShowTrans = false; lyActive = -1
                  lyStatus = if (lines.isEmpty()) "La letra está vacía. Toca Editar." else ""
                  refreshLyricsUi()
              }

              private fun loadLyrics(s: Song) {
                  if (lySong == s.id) return
                  lySong = s.id; lyLines = emptyList(); lyRaw = null; lyTrans = arrayOfNulls(0); lyActive = -1; pLine.text = ""
                  if (!showLyricsOn()) { lyStatus = "Las letras están ocultas. Actívalas en Ajustes."; refreshLyricsUi(); return }
                  val saved = prefs.getString("lyr_${s.id}", null)
                  if (saved != null) { setLyrics(saved); return }
                  if (prefs.getBoolean("lyn_${s.id}", false)) { lyStatus = "Sin letra. Toca Editar para añadirla."; refreshLyricsUi(); return }
                  lyStatus = "Buscando letra…"; refreshLyricsUi()
                  val tree = treeUri(); val kw = keyword(); val online = prefs.getBoolean("ly_online", true) && isOnline()
                  Thread {
                      var raw: String? = null
                      try { if (tree != null) raw = Lyrics.findInTree(this, tree, s.title, s.artist, kw) } catch (e: Exception) {}
                      if (raw == null && online) raw = Lyrics.fetchOnline(s.title, s.artist)
                      val found = raw
                      runOnUiThread {
                          if (lySong != s.id) return@runOnUiThread
                          if (found != null) { prefs.edit().putString("lyr_${s.id}", found).apply(); setLyrics(found) }
                          else { lyStatus = if (!isOnline()) "Sin internet: solo uso letras guardadas o de tu carpeta. Toca Editar para añadir una." else "No encontré la letra. Toca Editar para pegarla, o elige una carpeta en Ajustes."; refreshLyricsUi() }
                      }
                  }.start()
              }

              private fun translator(src: String, dst: String): Translator = translators.getOrPut("$src>$dst") {
                  Translation.getClient(TranslatorOptions.Builder().setSourceLanguage(src).setTargetLanguage(dst).build())
              }

              private fun translateLyrics(toSpanish: Boolean) {
                  if (lyLines.isEmpty()) { toast("No hay letra para traducir"); return }
                  val dst = if (toSpanish) TranslateLanguage.SPANISH else TranslateLanguage.ENGLISH
                  val src = if (toSpanish) TranslateLanguage.ENGLISH else TranslateLanguage.SPANISH
                  val song = lySong
                  val lines = lyLines
                  try {
                      val tr = translator(src, dst)
                      toast("Traduciendo…")
                      tr.downloadModelIfNeeded().addOnSuccessListener {
                          try {
                              if (lySong != song) return@addOnSuccessListener
                              lyTrans = arrayOfNulls(lines.size); lyShowTrans = true
                              translateStep(tr, song, lines, 0)
                          } catch (e: Throwable) { toast("No se pudo traducir") }
                      }.addOnFailureListener { toast(if (!isOnline()) "Sin internet: descarga los idiomas en Ajustes cuando tengas conexión" else "No se pudo descargar el idioma") }
                  } catch (e: Throwable) { toast("La traducción no está disponible en este teléfono") }
              }

              /** Traduce una línea a la vez (más estable que lanzar todas juntas). */
              private fun translateStep(tr: Translator, song: Long, lines: List<Lyrics.Line>, i: Int) {
                  if (lySong != song || i >= lines.size || i >= 150) { lyAdapter.notifyDataSetChanged(); return }
                  val line = lines[i].text
                  if (line.isBlank()) { translateStep(tr, song, lines, i + 1); return }
                  try {
                      tr.translate(line).addOnCompleteListener { t ->
                          try { if (t.isSuccessful && lySong == song && i < lyTrans.size) lyTrans[i] = t.result } catch (e: Throwable) {}
                          if (i % 4 == 0) lyAdapter.notifyDataSetChanged()
                          h.post { translateStep(tr, song, lines, i + 1) }
                      }
                  } catch (e: Throwable) { lyAdapter.notifyDataSetChanged() }
              }

              private fun downloadLangs() {
                  if (!isOnline()) { toast("Necesitas internet para descargar los idiomas"); return }
                  try {
                      translator(TranslateLanguage.ENGLISH, TranslateLanguage.SPANISH).downloadModelIfNeeded()
                          .addOnSuccessListener { toast("Inglés → Español listo") }.addOnFailureListener { toast("No se pudo descargar") }
