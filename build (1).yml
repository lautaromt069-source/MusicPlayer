              private fun speedDialog() {
                  val box = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(dp(20), dp(10), dp(20), 0) }
                  val tv = TextView(this).apply { text = "Velocidad: %.2fx".format(rate); textSize = 16f }
                  val lo = if (isPro()) 0.25f else 0.5f; val steps = if (isPro()) 55 else 30
                  val sb = SeekBar(this).apply { max = steps; progress = ((rate - lo) / 0.05f).toInt().coerceIn(0, steps) }
                  sb.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: SeekBar?, p: Int, u: Boolean) { if (u) { setRate(lo + p * 0.05f); tv.text = "Velocidad: %.2fx".format(rate) } }
                      override fun onStartTrackingTouch(s: SeekBar?) {}
                      override fun onStopTrackingTouch(s: SeekBar?) {}
                  })
                  val row = LinearLayout(this)
                  fun preset(t: String, r: Float) = btn(t, 1f) { setRate(r); sb.progress = ((r - lo) / 0.05f).toInt(); tv.text = "Velocidad: %.2fx".format(rate) }
                  row.addView(preset("🐢 Slowed", 0.8f)); row.addView(preset("Normal", 1f)); row.addView(preset("🐇 Sped up", 1.25f))
                  box.addView(tv); box.addView(sb); box.addView(row)
                  AlertDialog.Builder(this).setTitle("Velocidad").setView(box).setPositiveButton("Listo", null).show()
              }

