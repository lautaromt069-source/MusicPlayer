              // ================== Imágenes ==================
              private fun spaceBitmap(): Bitmap {
                  val w = 540; val hh = 960
                  val bm = Bitmap.createBitmap(w, hh, Bitmap.Config.ARGB_8888)
                  val c = Canvas(bm); val p = Paint(Paint.ANTI_ALIAS_FLAG)
                  p.shader = LinearGradient(0f, 0f, 0f, hh.toFloat(), Color.parseColor("#02010A"), Color.parseColor("#1A0B3D"), Shader.TileMode.CLAMP)
                  c.drawRect(0f, 0f, w.toFloat(), hh.toFloat(), p)
                  val r = java.util.Random(7)
                  fun blob(x: Float, y: Float, rad: Float, col: Int) { p.shader = RadialGradient(x, y, rad, col, Color.TRANSPARENT, Shader.TileMode.CLAMP); c.drawCircle(x, y, rad, p) }
                  blob(120f, 260f, 330f, Color.parseColor("#553A1FA8")); blob(430f, 520f, 380f, Color.parseColor("#44B02F8F")); blob(260f, 800f, 300f, Color.parseColor("#442A6FD0"))
                  p.shader = null
                  for (i in 0 until 260) { p.color = Color.argb(60 + r.nextInt(190), 255, 255, 255); c.drawCircle(r.nextFloat() * w, r.nextFloat() * hh, 0.5f + r.nextFloat() * 1.6f, p) }
                  p.shader = RadialGradient(430f, 800f, 120f, intArrayOf(Color.parseColor("#FFB07A"), Color.parseColor("#B5476B"), Color.parseColor("#2B1040")), floatArrayOf(0f, 0.6f, 1f), Shader.TileMode.CLAMP)
                  c.drawCircle(430f, 820f, 110f, p)
                  return bm
              }

