              private fun syncUi() {
                  try {
                      val c = ctrl ?: return
                      val s = current()
                      mini.visibility = if (s != null) View.VISIBLE else View.GONE
                      if (s != null && pT.text.toString() != s.title) {
                          pT.text = s.title; pS.text = s.artist; miniT.text = s.title; miniS.text = s.artist
                          thumb(s, art, 600) { applyTint(it) }; thumb(s, miniArt, 160)
                          list.invalidateViews()
                      }
                      if (s != null) { loadLyrics(s); if (lyView.visibility == View.VISIBLE) lyTitle.text = s.title + " · " + s.artist }
                      val icon = if (c.isPlaying) "⏸" else "▶"
                      pPlay.text = icon; miniPlay.text = icon
                      pShuf.alpha = if (c.shuffleModeEnabled) 1f else 0.4f
                      pRep.alpha = if (c.repeatMode != Player.REPEAT_MODE_OFF) 1f else 0.4f
                      pRep.text = if (c.repeatMode == Player.REPEAT_MODE_ONE) "🔂" else "🔁"
                      favBtn.text = if (isFav(s)) "♥" else "♡"
                      favBtn.setTextColor(if (isFav(s)) GREEN else Color.WHITE)
                  } catch (e: Exception) {}
              }

              private fun fmt(ms: Long) = "%d:%02d".format(ms / 60000, ms / 1000 % 60)

              private fun tick() {
                  try {
                      if (netTick++ % 6 == 0) offlineBar.visibility = if (isOnline()) View.GONE else View.VISIBLE
                      val c = ctrl
                      if (c != null && c.currentMediaItem != null) {
                          val d = c.duration; val pos = c.currentPosition
                          if (d > 0) {
                              seek.max = d.toInt(); seek.progress = pos.toInt(); timeTv.text = "${fmt(pos)} / ${fmt(d)}"
                              miniProg.progress = (pos * 1000 / d).toInt()
                          }
                          if (lySynced && lyLines.isNotEmpty()) {
                              var idx = -1
                              for (i in lyLines.indices) { if (lyLines[i].timeMs <= pos + 300) idx = i else break }
                              if (idx != lyActive) {
                                  lyActive = idx; lyAdapter.notifyDataSetChanged()
                                  pLine.text = lyLines.getOrNull(idx)?.text ?: ""
                                  if (lyView.visibility == View.VISIBLE && idx >= 0) lyList.smoothScrollToPositionFromTop(idx, lyList.height / 3)
                              }
                          }
                      }
                      if (sleepAt > 0) {
                          val left = sleepAt - System.currentTimeMillis()
                          if (left <= 0) { sleepAt = 0; ctrl?.pause(); sleepBtn.text = "⏲ Dormir" } else sleepBtn.text = "⏲ ${left / 60000 + 1} min"
                      }
                  } catch (e: Exception) {}
                  h.postDelayed({ tick() }, 500)
              }
          }
          LEB_EOF
          cd ..
          echo "PROJECT=leb" >> "$GITHUB_ENV"
          ls -la leb leb/app

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${HOME}/android-sdk"
          rm -rf "$SDK_ROOT"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          {
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
          } >> "$GITHUB_ENV"
          {
            echo "$SDK_ROOT/cmdline-tools/latest/bin"
            echo "$SDK_ROOT/platform-tools"
          } >> "$GITHUB_PATH"

      - name: Install SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --sdk_root="${ANDROID_HOME}" --licenses > /tmp/sdk-licenses.txt || true
          sdkmanager --sdk_root="${ANDROID_HOME}" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"
          sdkmanager --sdk_root="${ANDROID_HOME}" --list_installed | head -40

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          echo "sdk.dir=${ANDROID_HOME}" > "${PROJECT}/local.properties"
          cd "${PROJECT}"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find "${PROJECT}" -path "*/outputs/apk/debug/*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "No se genero el APK"
            find "${PROJECT}" -name "*.apk" || true
            exit 1
          fi
          cp "$APK" "L.E.B-M-1.5-beta.apk"
          ls -lh "L.E.B-M-1.5-beta.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: L.E.B-M-1.5-beta
          path: L.E.B-M-1.5-beta.apk
          if-no-files-found: error
