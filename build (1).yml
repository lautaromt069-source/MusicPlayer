              private fun selectPersona(i: Int) {
                  personaIdx = i
                  val p = AnimeAI.personas[i]
                  chat.clear(); chat.add(Msg(false, AnimeAI.greeting(p)))
                  personaRow.removeAllViews()
                  AnimeAI.personas.forEachIndexed { k, q -> personaRow.addView(chip("${q.emoji} ${q.type}", k == i) { selectPersona(k) }) }
                  chatTitle.text = "${p.emoji} ${p.name} · ${p.type}"
                  updateChatStatus()
                  chatView.background = GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM, intArrayOf(dark(p.color), Color.parseColor("#0B0B12")))
                  chatAdapter.notifyDataSetChanged()
              }

              private fun updateChatStatus() {
                  val p = AnimeAI.personas[personaIdx]
                  val live = (prefs.getString("ai_key", "") ?: "").isNotBlank() && isOnline()
                  chatStatus.text = (if (live) "IA en línea" else "Modo básico (sin IA en línea)") + " · " + p.tagline
              }

              private fun sendChat(text: String) {
                  if (chatBusy) return
                  val p = AnimeAI.personas[personaIdx]
                  chat.add(Msg(true, text)); chat.add(Msg(false, "…")); chatBusy = true; chatAdapter.notifyDataSetChanged()
                  val key = prefs.getString("ai_key", "") ?: ""
                  val model = prefs.getString("ai_model", "claude-haiku-5-5") ?: "claude-haiku-5-5"
                  val hist = chat.dropLast(1).map { Pair(if (it.mine) "user" else "assistant", it.text) }.dropWhile { it.first == "assistant" }
                  val library = songs.shuffled().take(60).map { it.title + " — " + it.artist }
                  val titles = songs.map { it.title }
                  val live = key.isNotBlank() && isOnline()
                  Thread {
                      var reply: String
                      try {
                          reply = if (live) AnimeAI.ask(key, model, p, hist, library) else AnimeAI.offlineReply(p, text, titles)
                      } catch (e: Exception) {
                          reply = AnimeAI.offlineReply(p, text, titles) + "\n(La IA en línea no respondió: " + (e.message ?: "error") + ")"
                      }
                      val r = reply
                      runOnUiThread { if (chat.isNotEmpty()) chat.removeAt(chat.size - 1); chat.add(Msg(false, r)); chatBusy = false; chatAdapter.notifyDataSetChanged(); updateChatStatus() }
                  }.start()
              }

