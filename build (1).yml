                          }
                      } catch (e: Exception) {}
                      val res = bm ?: spaceBitmap()
                      runOnUiThread { bg.setImageBitmap(res) }
                  }.start()
              }

              /** Emblema L.E.B (también se usa como portada cuando la canción no tiene). */
              private fun emblem(size: Int): Bitmap = logos.getOrPut(size) {
                  val bm = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888)
                  val c = Canvas(bm); val p = Paint(Paint.ANTI_ALIAS_FLAG); val s = size.toFloat()
                  p.shader = LinearGradient(0f, 0f, s, s, Color.parseColor("#6D4BFF"), Color.parseColor("#1B1245"), Shader.TileMode.CLAMP)
                  c.drawRoundRect(0f, 0f, s, s, s * 0.22f, s * 0.22f, p)
                  p.shader = null; p.style = Paint.Style.STROKE; p.strokeWidth = s * 0.035f; p.color = Color.parseColor("#B9A8FF")
                  c.drawCircle(s / 2, s / 2, s * 0.36f, p)
                  p.style = Paint.Style.FILL; p.color = Color.WHITE; p.textAlign = Paint.Align.CENTER; p.isFakeBoldText = true; p.textSize = s * 0.17f
                  c.drawText("L.E.B-M", s / 2, s * 0.52f, p)
                  p.isFakeBoldText = false; p.color = Color.parseColor("#D9CFFF"); p.textSize = s * 0.085f
                  c.drawText("computing", s / 2, s * 0.66f, p)
                  bm
              }

              private fun art(s: Song) = ContentUris.withAppendedId(Uri.parse("content://media/external/audio/albumart"), s.albumId)

              private fun thumb(s: Song, iv: ImageView, size: Int, done: ((Bitmap) -> Unit)? = null) {
                  val key = s.uri.toString() + size; iv.tag = key
                  cache.get(key)?.let { iv.setImageBitmap(it); done?.invoke(it); return }
                  iv.setImageBitmap(emblem(size)); done?.invoke(emblem(size))
                  if (Build.VERSION.SDK_INT < 29) return
                  Thread {
                      try {
                          val bm = contentResolver.loadThumbnail(s.uri, Size(size, size), null)
                          cache.put(key, bm)
                          runOnUiThread { if (iv.tag == key) { iv.setImageBitmap(bm); done?.invoke(bm) } }
                      } catch (e: Exception) {}
                  }.start()
              }

              /** Tiñe el reproductor con el color de la portada, como en las apps de música. */
              private fun applyTint(bm: Bitmap) {
                  try {
                      val px = Bitmap.createScaledBitmap(bm, 1, 1, true).getPixel(0, 0)
                      val hsv = FloatArray(3); Color.colorToHSV(px, hsv)
                      hsv[1] = minOf(1f, hsv[1] + 0.15f); hsv[2] = minOf(hsv[2], 0.55f).coerceAtLeast(0.30f)
                      tint = Color.HSVToColor(hsv)
                      val g = intArrayOf(tint, Color.parseColor("#0B0B12"))
                      full.background = GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM, g)
                      lyView.background = GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM, g)
                  } catch (e: Exception) {}
              }

              private fun roundImg(r: Int = 8) = ImageView(this).apply { scaleType = ImageView.ScaleType.CENTER_CROP; background = rounded(Color.parseColor("#2A2A35"), r); clipToOutline = true; outlineProvider = ViewOutlineProvider.BACKGROUND }

              // ================== Motor de música ==================
              private val listener = object : Player.Listener {
                  override fun onMediaItemTransition(m: MediaItem?, r: Int) { syncUi() }
                  override fun onIsPlayingChanged(p: Boolean) { syncUi() }
                  override fun onPlaybackStateChanged(s: Int) { syncUi() }
                  override fun onPlayerError(e: PlaybackException) {
                      toast("No se pudo reproducir esta canción")
                      try { ctrl?.let { if (it.hasNextMediaItem()) { it.seekToNext(); it.prepare(); it.play() } } } catch (x: Exception) {}
                  }
              }

              private fun connect() {
                  try {
                      val token = SessionToken(this, ComponentName(this, PlaybackService::class.java))
                      val f = MediaController.Builder(this, token).buildAsync()
                      f.addListener({
                          try { ctrl = f.get(); ctrl?.addListener(listener); syncUi() } catch (e: Exception) { toast("No se pudo iniciar el reproductor") }
                      }, Executor { h.post(it) })
                  } catch (e: Exception) { toast("No se pudo iniciar el reproductor") }
              }

              private fun item(s: Song) = MediaItem.Builder().setMediaId(s.id.toString()).setUri(s.uri)
                  .setMediaMetadata(MediaMetadata.Builder().setTitle(s.title).setArtist(s.artist).setAlbumTitle(s.album).setArtworkUri(art(s)).build()).build()

              private fun playList(l: List<Song>, i: Int) {
                  val c = ctrl ?: run { toast("Conectando…"); return }
                  try { c.setMediaItems(l.map { item(it) }, i, 0L); c.prepare(); c.play(); applySpeed(); full.visibility = View.VISIBLE } catch (e: Exception) { toast("No se pudo reproducir") }
              }

              private fun shuffleAll() {
                  if (songs.isEmpty()) { toast("No hay música"); return }
                  ctrl?.shuffleModeEnabled = true
                  playList(songs, (Math.random() * songs.size).toInt())
              }

              private fun current(): Song? = ctrl?.currentMediaItem?.mediaId?.let { id -> songs.find { it.id.toString() == id } }
              private fun applySpeed() { try { ctrl?.setPlaybackParameters(PlaybackParameters(rate, if (keepPitch) 1f else rate)) } catch (e: Exception) {} }
              private fun setRate(r: Float) { rate = r; applySpeed() }
              private fun togglePlay() { ctrl?.let { if (it.isPlaying) it.pause() else it.play() } }

              // ================== Biblioteca ==================
              private fun scan() {
                  Thread {
                      val out = ArrayList<Song>()
                      try {
                          val base = AM.EXTERNAL_CONTENT_URI
                          val shortSel = if (prefs.getBoolean("short", false)) "" else "AND ${AM.DURATION}>=30000 "
                          contentResolver.query(base, arrayOf(AM._ID, AM.TITLE, AM.ARTIST, AM.ALBUM, AM.ALBUM_ID),
                              "${AM.IS_MUSIC}!=0 ${shortSel}AND ${AM.DATA} NOT LIKE '%WhatsApp%'", null, "${AM.TITLE} COLLATE NOCASE ASC")?.use { c ->
                              while (c.moveToNext()) {
                                  val artist = c.getString(2)?.takeIf { it != "<unknown>" } ?: "Artista desconocido"
                                  out.add(Song(c.getLong(0), c.getString(1) ?: "Sin título", artist, c.getString(3) ?: "Álbum desconocido", c.getLong(4), ContentUris.withAppendedId(base, c.getLong(0))))
                              }
                          }
                      } catch (e: Exception) {}
                      runOnUiThread { songs.clear(); songs.addAll(out); refresh(); if (out.isEmpty()) toast("No encontré música en tu teléfono") else toast("${out.size} canciones") }
                  }.start()
              }

              private fun favs(): MutableSet<String> = HashSet(prefs.getStringSet("fav", emptySet()) ?: emptySet())
              private fun isFav(s: Song?) = s != null && favs().contains(s.id.toString())
              private fun toggleFav(s: Song?) {
                  if (s == null) return
                  val set = favs()
                  if (!set.remove(s.id.toString())) set.add(s.id.toString())
                  prefs.edit().putStringSet("fav", set).apply()
                  syncUi(); rebuildRows()
              }

              private fun songRows(l: List<Song>) = l.mapIndexed { i, s -> Row(s.title, s.artist + if (isFav(s)) "  ♥" else "", s, { toggleFav(s) }) { playList(l, i) } }
              private fun groupRows(by: (Song) -> String, kind: String, q: String): List<Row> =
                  songs.groupBy(by).filter { q.isEmpty() || it.key.contains(q, true) }.map { (k, v) -> Row(k, "${v.size} canciones", v.first()) { fKind = kind; fVal = k; refresh() } }

              private fun refresh() {
                  buildControls(); rebuildRows()
                  navBtns.forEachIndexed { i, b -> b.setTextColor(if (i == page) GREEN else GRAY) }
              }

              private fun chip(t: String, sel: Boolean, f: () -> Unit) = TextView(this).apply {
                  text = t; textSize = 13f; setPadding(dp(14), dp(7), dp(14), dp(7))
                  background = rounded(if (sel) Color.WHITE else Color.parseColor("#44FFFFFF"), 20); setTextColor(if (sel) Color.BLACK else Color.WHITE)
                  setOnClickListener { f() }; layoutParams = LinearLayout.LayoutParams(-2, -2).apply { setMargins(dp(4), dp(4), dp(4), dp(4)) }
              }

              private fun chipRow(names: List<String>, cur: Int, f: (Int) -> Unit) = LinearLayout(this).apply {
                  setPadding(dp(12), 0, dp(12), 0)
                  names.forEachIndexed { i, n -> addView(chip(n, i == cur) { f(i) }) }
              }

              private fun buildControls() {
                  controls.removeAllViews()
                  if (fKind.isNotEmpty()) { controls.addView(btn("‹ Volver   ·   $fVal") { fKind = ""; refresh() }.apply { setTextColor(GREEN) }); return }
                  when (page) {
                      0 -> {}
                      1 -> { controls.addView(searchBox); controls.addView(chipRow(listOf("Canciones", "Artistas", "Álbumes"), scope) { scope = it; refresh() }) }
                      else -> controls.addView(chipRow(listOf("Artistas", "Álbumes", "Favoritas"), libSub) { libSub = it; refresh() })
                  }
              }

              private fun rebuildRows() {
                  val q = query.trim()
                  rows = when {
                      fKind.isNotEmpty() -> songRows(songs.filter { if (fKind == "a") it.artist == fVal else it.album == fVal })
                      page == 0 -> songRows(songs)
                      page == 1 -> when {
                          q.isEmpty() -> listOf(Row("Busca canciones, artistas o álbumes", "") {})
                          scope == 1 -> onlineRows(q) + groupRows({ it.artist }, "a", q)
                          scope == 2 -> onlineRows(q) + groupRows({ it.album }, "b", q)
                          else -> onlineRows(q) + songRows(songs.filter { it.title.contains(q, true) || it.artist.contains(q, true) || it.album.contains(q, true) })
                      }
                      else -> when (libSub) { 0 -> groupRows({ it.artist }, "a", ""); 1 -> groupRows({ it.album }, "b", ""); else -> songRows(songs.filter { isFav(it) }) }
                  }
                  try { homeHeader?.let { list.removeHeaderView(it) } } catch (e: Exception) {}
                  homeHeader = null
                  if (page == 0 && fKind.isEmpty()) { val hv = buildHome(); homeHeader = hv; list.addHeaderView(hv, null, false) }
                  list.adapter = object : BaseAdapter() {
                      override fun getCount() = rows.size
                      override fun getItem(p: Int) = rows[p]
                      override fun getItemId(p: Int) = p.toLong()
                      override fun getView(p: Int, v: View?, g: ViewGroup): View {
                          val r = rows[p]
                          val view = (v as? LinearLayout) ?: LinearLayout(this@MainActivity).apply {
                              gravity = Gravity.CENTER_VERTICAL; setPadding(dp(16), dp(6), dp(16), dp(6))
                              addView(roundImg(), LinearLayout.LayoutParams(dp(52), dp(52)))
                              addView(LinearLayout(this@MainActivity).apply { orientation = LinearLayout.VERTICAL; setPadding(dp(12), 0, 0, 0); addView(txt("", 15f, Color.WHITE).apply { setSingleLine(true) }); addView(txt("", 12f, GRAY).apply { setSingleLine(true) }) }, LinearLayout.LayoutParams(0, -2, 1f))
                          }
                          val img = view.getChildAt(0) as ImageView
                          val col = view.getChildAt(1) as LinearLayout
                          (col.getChildAt(0) as TextView).apply { text = r.t; setTextColor(if (r.song != null && r.song.id == current()?.id && r.long != null) GREEN else Color.WHITE) }
                          (col.getChildAt(1) as TextView).text = r.s
                          img.visibility = if (r.song == null) View.GONE else View.VISIBLE
                          img.setImageDrawable(null); img.tag = null
                          r.song?.let { thumb(it, img, 160) }
                          view.setOnClickListener { r.click() }
                          view.setOnLongClickListener { r.long?.invoke(); r.long != null }
                          return view
                      }
                  }
              }

              private fun isOnline(): Boolean = if (prefs.getBoolean("force_offline", false)) false else try {
                  val cm = getSystemService(ConnectivityManager::class.java)
                  val n = cm.activeNetwork
                  val caps = if (n != null) cm.getNetworkCapabilities(n) else null
                  caps != null && caps.hasCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET)
              } catch (e: Exception) { false }

              private fun onlineRows(q: String): List<Row> {
                  val sub = if (isOnline()) "Se abre la app o la web con tu búsqueda" else "Sin internet · conéctate para buscar en línea"
                  return listOf(Row("🎧  Buscar «$q» en Spotify", sub) { openSearch(true, q) }, Row("▶  Buscar «$q» en YouTube", sub) { openSearch(false, q) })
              }

              private fun openSearch(spotify: Boolean, q: String) {
                  if (!isOnline()) { toast("Sin internet. Conéctate para buscar en línea."); return }
                  val e = Uri.encode(q)
                  try {
                      if (spotify) {
                          try { startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("spotify:search:$e"))) }
                          catch (x: Exception) { startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("https://open.spotify.com/search/$e"))) }
                      } else startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("https://www.youtube.com/results?search_query=$e")))
                  } catch (x: Exception) { toast("No se pudo abrir") }
              }

              private fun buildIntro(): View {
                  val layer = FrameLayout(this).apply { setBackgroundColor(Color.BLACK); isClickable = true }
                  introLayer = layer
                  val nature = NatureIntro(this, emblem(400))
                  val vv = VideoView(this).apply { visibility = View.GONE }
                  layer.addView(nature, FrameLayout.LayoutParams(-1, -1))
                  layer.addView(vv, FrameLayout.LayoutParams(-1, -1, Gravity.CENTER))
                  val skip = txt("Saltar ›", 14f, Color.WHITE).apply {
                      setPadding(dp(16), dp(8), dp(16), dp(8)); background = rounded(Color.parseColor("#66000000"), 16)
                      setOnClickListener { endIntro(layer) }
                  }
                  layer.addView(skip, FrameLayout.LayoutParams(-2, -2, Gravity.END or Gravity.BOTTOM).apply { setMargins(0, 0, dp(16), dp(40)) })
                  if (!prefs.getBoolean("intro_on", true)) { layer.visibility = View.GONE; return layer }
                  val video = prefs.getString("intro_video", null)
                  if (video != null) {
                      try {
                          nature.visibility = View.GONE; vv.visibility = View.VISIBLE
                          vv.setOnCompletionListener { vv.visibility = View.GONE; nature.visibility = View.VISIBLE; nature.play(0.8f) { endIntro(layer) } }
                          vv.setOnErrorListener { _, _, _ -> vv.visibility = View.GONE; nature.visibility = View.VISIBLE; nature.play(0f) { endIntro(layer) }; true }
                          vv.setVideoURI(Uri.parse(video)); vv.start()
                      } catch (e: Exception) { vv.visibility = View.GONE; nature.visibility = View.VISIBLE; nature.play(0f) { endIntro(layer) } }
                  } else nature.play(0f) { endIntro(layer) }
                  return layer
              }

              private fun endIntro(layer: View) {
                  if (layer.visibility != View.VISIBLE) return
                  layer.animate().alpha(0f).setDuration(500).withEndAction { layer.visibility = View.GONE }.start()
              }

