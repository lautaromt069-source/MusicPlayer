                      val on = lySynced && p == lyActive
                      a.text = l.text.ifBlank { "♪" }
                      a.textSize = lyricSize().toFloat() * (if (on) 1.12f else 1f)
                      a.setTextColor(if (!lySynced || on) Color.WHITE else Color.parseColor("#80FFFFFF"))
                      a.setTypeface(null, if (on) Typeface.BOLD else Typeface.NORMAL)
                      val t = if (lyShowTrans) lyTrans.getOrNull(p) else null
                      b.visibility = if (t.isNullOrBlank()) View.GONE else View.VISIBLE
                      b.text = t ?: ""; b.textSize = lyricSize() * 0.75f
                      return box
                  }
              }

