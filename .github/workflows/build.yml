name: Build L.E.B-M 1.4
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack if MusicPlayer.zip present
        run: |
          if [ -f MusicPlayer.zip ]; then unzip -q -o MusicPlayer.zip; fi
          D=\( (dirname " \)(find . -name settings.gradle -not -path './.git/*' | head -n1)")
          if [ -z "$D" ] || [ ! -f "$D/settings.gradle" ]; then
            echo "No settings.gradle"; find . -maxdepth 4 -type f | head -40; exit 1
          fi
          echo "PROJECT=$D" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-31" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build
        run: gradle assembleDebug --stacktrace
        working-directory: ${{ env.PROJECT }}

      - run: cp "$PROJECT/app/build/outputs/apk/debug/app-debug.apk" L.E.B-M-1.4.apk

      - uses: actions/upload-artifact@v4
        with:
          name: L.E.B-M-1.4
          path: L.E.B-M-1.4.apk
          if-no-files-found: error
