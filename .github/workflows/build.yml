    private fun startBgAnimation() {
        if (!animBgEnabled) {
            animBgView.setBackgroundColor(if (spaceBgEnabled) Color.TRANSPARENT else BG)
            return
        }
        stopBgAnimation()
        val p = arrayOf(
            intArrayOf(Color.parseColor("#181E3B"), Color.parseColor("#090B14"), Color.parseColor("#0B2A1E")),
            intArrayOf(Color.parseColor("#24143F"), Color.parseColor("#0B0C18"), Color.parseColor("#0E2236")),
            intArrayOf(Color.parseColor("#0C291F"), Color.parseColor("#090B14"), Color.parseColor("#1C1438"))
        )
        var i = 0
        bgAnimator = ValueAnimator.ofFloat(0f, 1f).apply {
            duration = 4500L
            repeatCount = ValueAnimator.INFINITE
            interpolator = LinearInterpolator()
            addUpdateListener { a ->
                val f = a.animatedFraction
                val from = p[i % p.size]
                val to = p[(i + 1) % p.size]
                val ev = ArgbEvaluator()
                val c1 = ev.evaluate(f, from[0], to[0]) as Int
                val c2 = ev.evaluate(f, from[1], to[1]) as Int
                val c3 = ev.evaluate(f, from[2], to[2]) as Int
                animBgView.background = GradientDrawable(GradientDrawable.Orientation.TL_BR, intArrayOf(c1, c2, c3))
            }
            addListener(object : android.animation.AnimatorListenerAdapter() {
                override fun onAnimationRepeat(animation: android.animation.Animator) {
                    i = (i + 1) % p.size
                }
            })
            start()
        }
    }

    private fun stopBgAnimation() {
        bgAnimator?.cancel()
        bgAnimator = null
    }

    private fun lyricKey(s: Song?) = if (s == null) "" else "leb_lyric_${s.id}"

    private fun parseLrc(raw: String): List<LyricLine> {
        val lines = mutableListOf<LyricLine>()
        val regex = Regex("\\[(\\d{1,2}):(\\d{2})(?:\\.(\\d{1,3}))?\\]\\s*(.*)")
        for (line in raw.lines()) {
            val m = regex.find(line.trim())
            if (m != null) {
                val min = m.groupValues[1].toLongOrNull() ?: 0L
                val sec = m.groupValues[2].toLongOrNull() ?: 0L
                val msPart = m.groupValues[3]
                val ms = when {
                    msPart.isEmpty() -> 0L
                    msPart.length == 1 -> msPart.toLong() * 100L
                    msPart.length == 2 -> msPart.toLong() * 10L
                    else -> msPart.take(3).toLongOrNull() ?: 0L
                }
                val text = m.groupValues[4].trim()
                if (text.isNotEmpty()) {
                    lines.add(LyricLine(min * 60000L + sec * 1000L + ms, text))
                }
            }
        }
        return lines.sortedBy { it.timeMs }
    }

    private fun loadLyrics(s: Song?): Pair<String, List<LyricLine>> {
        if (s == null) return "Reproduce una cancion para ver su letra." to emptyList()

        val custom = prefs.getString(lyricKey(s), null)
        if (!custom.isNullOrBlank()) {
            val parsed = parseLrc(custom)
            return if (parsed.isNotEmpty()) custom to parsed
            else custom to custom.lines().filter { it.isNotBlank() }.map { LyricLine(0L, it) }
        }

        val baseDirs = listOfNotNull(
            getExternalFilesDir(null),
            Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_MUSIC),
            Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS)
        )
        val cleanName = s.title.replace(Regex("[\\\\/:*?\"<>|]"), "").trim()
        for (dir in baseDirs) {
            if (!dir.exists()) continue
            val candidates = listOf(
                File(dir, "$cleanName.lrc"),
                File(dir, "$cleanName.txt"),
                File(File(dir, lyricKeyword), "$cleanName.lrc"),
                File(File(dir, lyricKeyword), "$cleanName.txt")
            )
            val found = candidates.firstOrNull { it.exists() && it.canRead() }
            if (found != null) {
                val raw = found.readText()
                val parsed = parseLrc(raw)
                return if (parsed.isNotEmpty()) raw to parsed
                else {
                    val plain = raw.lines().joinToString("\n") {
                        it.replace(Regex("^\\[[0-9:.]+\\]\\s*"), "")
                    }.trim()
                    plain to plain.lines().filter { it.isNotBlank() }.map { LyricLine(0L, it) }
                }
            }
        }

        return "Sin letra para \"${s.title}\".\nToca \"Editar\" para agregarla o pon un archivo .lrc" to emptyList()
    }

    private fun translateLineRemote(text: String, toLang: String): String {
        if (text.isBlank()) return ""
        return try {
            val q = URLEncoder.encode(text, "UTF-8")
            val url = URL("https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=$toLang&dt=t&q=$q")
            val conn = (url.openConnection() as HttpURLConnection).apply {
                requestMethod = "GET"
                connectTimeout = 4000
                readTimeout = 4000
            }
            val resp = BufferedReader(InputStreamReader(conn.inputStream)).use { it.readText() }
            conn.disconnect()
            val m = Regex("^\\[\\[\\[\"((?:[^\"\\\\]|\\\\.)*)\"").find(resp)
            if (m != null) unescapeJson(m.groupValues[1]) else text
        } catch (_: Exception) {
            text
        }
    }

    private fun refreshLyrics(s: Song?) {
        if (!::lyricsPanel.isInitialized || !::lyricsTextView.isInitialized) return
        lyricsPanel.visibility = if (showLyrics) View.VISIBLE else View.GONE
        lyricsTextView.textSize = lyricSize

        val (display, lines) = loadLyrics(s)
        lyricLines = lines
        translatedLines = emptyList()
        currentLyricIndex = -1

        if (translateLyrics && lines.isNotEmpty()) {
            val snapshot = lines.map { it.text }
            val lang = targetLang
            Thread {
                val tr = snapshot.map { translateLineRemote(it, lang) }
                runOnUiThread {
                    if (translateLyrics && lyricLines.map { it.text } == snapshot) {
                        translatedLines = tr
                        updateLyricHighlight(currentLyricIndex)
                    }
                }
            }.start()
        }

        if (lines.isEmpty() || lines.all { it.timeMs == 0L }) {
            lyricsTextView.text = display
            lyricsTextView.setTextColor(Color.WHITE)
        } else {
            updateLyricHighlight(-1)
        }
    }

    private fun updateLyricHighlight(index: Int) {
        if (lyricLines.isEmpty()) return
        currentLyricIndex = index

        val sb = SpannableStringBuilder()
        lyricLines.forEachIndexed { i, line ->
            if (i > 0) sb.append("\n")
            val start = sb.length
            sb.append(line.text)
            val end = sb.length

            if (i == index) {
                sb.setSpan(ForegroundColorSpan(LYRIC_ACTIVE), start, end, Spannable.SPAN_EXCLUSIVE_EXCLUSIVE)
                sb.setSpan(StyleSpan(Typeface.BOLD), start, end, Spannable.SPAN_EXCLUSIVE_EXCLUSIVE)
                sb.setSpan(RelativeSizeSpan(1.16f), start, end, Spannable.SPAN_EXCLUSIVE_EXCLUSIVE)
            } else {
                val dim = if (index >= 0 && abs(i - index) <= 1) Color.parseColor("#B6BED6") else LYRIC_INACTIVE
                sb.setSpan(ForegroundColorSpan(dim), start, end, Spannable.SPAN_EXCLUSIVE_EXCLUSIVE)
            }

            if (translateLyrics && i < translatedLines.size && translatedLines[i].isNotBlank()) {
                sb.append("\n")
                val tStart = sb.length
                sb.append("-> ${translatedLines[i]}")
                val tEnd = sb.length
                val tColor = if (i == index) LYRIC_TRANS else Color.parseColor("#6CA882")
                sb.setSpan(ForegroundColorSpan(tColor), tStart, tEnd, Spannable.SPAN_EXCLUSIVE_EXCLUSIVE)
                sb.setSpan(RelativeSizeSpan(0.92f), tStart, tEnd, Spannable.SPAN_EXCLUSIVE_EXCLUSIVE)
            }
        }
        lyricsTextView.text = sb

        if (index >= 0 && ::lyricsScrollView.isInitialized) {
            lyricsTextView.post {
                try {
                    val layout = lyricsTextView.layout ?: return@post
                    if (index >= layout.lineCount) return@post
                    val y = layout.getLineTop(index)
                    val centerOffset = lyricsScrollView.height / 3
                    lyricsScrollView.smoothScrollTo(0, (y - centerOffset).coerceAtLeast(0))
                } catch (_: Exception) {}
            }
        }
    }

    private fun showLyricEditor(s: Song) {
        val box = LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
            setPadding(dpSize(18), dpSize(12), dpSize(18), dpSize(6))
        }
        val input = EditText(this).apply {
            setText(prefs.getString(lyricKey(s), "") ?: "")
            hint = "Pega la letra (soporta formato LRC con [mm:ss.xx])"
            minLines = 8
            gravity = Gravity.TOP or Gravity.START
            inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_FLAG_MULTI_LINE
            setTextColor(Color.WHITE)
            setHintTextColor(GRAY)
        }
        box.addView(input)
        AlertDialog.Builder(this)
            .setTitle("Letra - ${s.title}")
            .setView(box)
            .setPositiveButton("Guardar") { _, _ ->
                prefs.edit().putString(lyricKey(s), input.text.toString().trim()).apply()
                refreshLyrics(s)
                Toast.makeText(this, "Letra guardada", Toast.LENGTH_SHORT).show()
            }
            .setNeutralButton("Borrar") { _, _ ->
                prefs.edit().remove(lyricKey(s)).apply()
                refreshLyrics(s)
            }
            .setNegativeButton("Cancelar", null)
            .show()
    }

