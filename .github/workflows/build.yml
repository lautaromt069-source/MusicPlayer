name: Build L.E.B-M v1.3 APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate Android project
        run: |
          if [ -f MusicPlayer.zip ]; then
            mkdir -p leb_src
            unzip -q -o MusicPlayer.zip -d leb_src
            D=$(dirname "$(find leb_src \( -name settings.gradle -o -name settings.gradle.kts \) | head -n1)")
          else
            D=$(dirname "$(find . \( -name settings.gradle -o -name settings.gradle.kts \) -not -path './.git/*' | head -n1)")
          fi
          echo "PROJECT=$D" >> $GITHUB_ENV
          echo "Proyecto detectado en: $D"

      - name: Update version to 1.3
        run: |
          python3 - << 'EOF'
          import os, re

          root = os.environ["PROJECT"]
          exts = (".gradle", ".kts", ".properties", ".toml", ".xml", ".kt", ".java", ".json")
          changed = []

          for dirpath, dirnames, filenames in os.walk(root):
              dirnames[:] = [d for d in dirnames if d not in ("build", ".git", ".gradle")]
              for fn in filenames:
                  if fn.endswith(exts) or fn == "gradle.properties":
                      path = os.path.join(dirpath, fn)
                      try:
                          with open(path, "r", encoding="utf-8") as f:
                              original = f.read()
                      except Exception:
                          continue

                      updated = original
                      updated = re.sub(r'(versionName\s*=?\s*["\'])([^"\']*)(["\'])', r'\g<1>1.3\g<3>', updated)
                      updated = re.sub(r'(\bversionCode\s*=?\s*)(\d+)', r'\g<1>13', updated)
                      updated = re.sub(r'(VERSION_NAME\s*=\s*["\']?)([^"\'\s]+)(["\']?)', r'\g<1>1.3\g<3>', updated)
                      updated = re.sub(r'(VERSION_CODE\s*=\s*)(\d+)', r'\g<1>13', updated)
                      updated = re.sub(r'\b1\.2\b', '1.3', updated)

                      if updated != original:
                          with open(path, "w", encoding="utf-8") as f:
                              f.write(updated)
                          changed.append(path)

          print("Archivos actualizados a 1.3:", len(changed))
          for c in changed:
              print(" -", c)
          EOF

      - name: Generate app icon and L.E.B-M logo
        run: |
          python3 - << 'EOF'
          import math, os, struct, zlib

          res_dir = os.path.join(os.environ["PROJECT"], "app", "src", "main", "res")

          def build_png(size, mode):
              def chunk(tag, data):
                  return (
                      struct.pack("!I", len(data))
                      + tag
                      + data
                      + struct.pack("!I", zlib.crc32(tag + data) & 0xFFFFFFFF)
                  )

              cx, cy = (size - 1) / 2.0, (size - 1) / 2.0
              r_outer = size * 0.44
              r_inner = size * 0.20
              rows = []

              for y in range(size):
                  row = bytearray([0])
                  for x in range(size):
                      dist = math.hypot(x - cx, y - cy)
                      if mode == "launcher":
                          if dist <= r_outer:
                              if dist <= r_inner:
                                  r, g, b, a = 15, 23, 36, 255
                              else:
                                  mix = (x + y) / max(1.0, 2.0 * size)
                                  r = int(16 + 28 * mix)
                                  g = int(195 - 35 * mix)
                                  b = int(140 + 95 * mix)
                                  a = 255
                          else:
                              r, g, b, a = 10, 14, 22, 255
                      else:
                          if dist <= r_outer:
                              t = min(1.0, dist / max(1.0, r_outer))
                              r = int(18 + 36 * t)
                              g = int(215 - 75 * t)
                              b = int(145 + 65 * (1.0 - t))
                              a = 255
                          else:
                              r, g, b, a = 0, 0, 0, 0

                      row.extend((
                          max(0, min(255, r)),
                          max(0, min(255, g)),
                          max(0, min(255, b)),
                          max(0, min(255, a)),
                      ))
                  rows.append(bytes(row))

              raw = b"".join(rows)
              ihdr = struct.pack("!IIBBBBB", size, size, 8, 6, 0, 0, 0)
              return (
                  b"\x89PNG\r\n\x1a\n"
                  + chunk(b"IHDR", ihdr)
                  + chunk(b"IDAT", zlib.compress(raw, level=9))
                  + chunk(b"IEND", b"")
              )

          mipmaps = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          for folder, px in mipmaps.items():
              out_dir = os.path.join(res_dir, f"mipmap-{folder}")
              os.makedirs(out_dir, exist_ok=True)
              for fname in ("ic_launcher.png", "ic_launcher_round.png"):
                  fpath = os.path.join(out_dir, fname)
                  if not os.path.exists(fpath):
                      with open(fpath, "wb") as f:
                          f.write(build_png(px, "launcher"))

          drawable_dir = os.path.join(res_dir, "drawable")
          os.makedirs(drawable_dir, exist_ok=True)
          with open(os.path.join(drawable_dir, "leb_m_logo.png"), "wb") as f:
              f.write(build_png(256, "logo"))
          EOF

      - name: Configure safe translations and credits
        run: |
          RES_DIR="$PROJECT/app/src/main/res"
          mkdir -p "$RES_DIR/values" "$RES_DIR/values-es"

          cat << 'EOF' > "$RES_DIR/values/strings.xml"
          <resources>
              <string name="app_name">L.E.B-M</string>
              <string name="version_label">Version 1.3</string>
              <string name="created_by">Created by Lautaro and Claude</string>
              <string name="intro_nature_text">Nature atmosphere loading...</string>
              <string name="intro_logo_text">L.E.B-M</string>
              <string name="search_hint">Search music (YouTube, Spotify, Local)</string>
              <string name="offline_status">Offline mode: local music only</string>
              <string name="online_status">Online mode: YouTube &amp; Spotify ready</string>
              <string name="filter_all">All</string>
              <string name="filter_youtube">YouTube</string>
              <string name="filter_spotify">Spotify</string>
              <string name="filter_local">Local</string>
          </resources>
          EOF

          cat << 'EOF' > "$RES_DIR/values-es/strings.xml"
          <resources>
              <string name="app_name">L.E.B-M</string>
              <string name="version_label">Versión 1.3</string>
              <string name="created_by">Creado por Lautaro y Claude</string>
              <string name="intro_nature_text">Cargando escena de naturaleza...</string>
              <string name="intro_logo_text">L.E.B-M</string>
              <string name="search_hint">Buscar música (YouTube, Spotify, Local)</string>
              <string name="offline_status">Sin Internet: solo música local</string>
              <string name="online_status">Con Internet: YouTube y Spotify listos</string>
              <string name="filter_all">Todo</string>
              <string name="filter_youtube">YouTube</string>
              <string name="filter_spotify">Spotify</string>
              <string name="filter_local">Local</string>
          </resources>
          EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - run: gradle assembleDebug
        working-directory: ${{ env.PROJECT }}

      - run: cp "$PROJECT/app/build/outputs/apk/debug/app-debug.apk" L.E.B-M-v1.3.apk

      - uses: actions/upload-artifact@v4
        with:
          name: L.E.B-M-v1.3
          path: L.E.B-M-v1.3.apk
