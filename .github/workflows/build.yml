    private fun setRate(r: Float) {
        rate = r
        speedLabel.text = "Velocidad: %.2fx".format(rate)
        applySpeed()
    }

    private fun togglePlay() {
        try {
            val c = ctrl
            if (c != null && c.mediaItemCount > 0) {
                if (c.isPlaying) c.pause() else c.play()
                syncUi()
                return
            }
            val mp = fallbackPlayer
            if (mp != null && fallbackPrepared) {
                if (mp.isPlaying) {
                    mp.pause()
                    fallbackPlaying = false
                } else {
                    mp.start()
                    fallbackPlaying = true
                }
                syncUi()
                return
            }
            val pool = if (songs.isNotEmpty()) songs else onlineSongs
            if (pool.isNotEmpty()) playFallback(pool, 0)
        } catch (_: Exception) {}
    }

    private fun sleepDialog() {
        val o = arrayOf("15 minutos", "30 minutos", "45 minutos", "1 hora", "Cancelar temporizador")
        val m = intArrayOf(15, 30, 45, 60, 0)
        AlertDialog.Builder(this).setTitle("Temporizador para dormir").setItems(o) { _, i ->
            sleepAt = if (m[i] == 0) 0L else System.currentTimeMillis() + m[i] * 60000L
            if (m[i] == 0) sleepBtn.text = "Dormir"
        }.show()
    }

    private fun syncUi() {
        try {
            val c = ctrl
            val s = current()
            miniPlayer.visibility = if (s != null) View.VISIBLE else View.GONE

            if (s != null && playerTitle.text.toString() != s.title) {
                playerTitle.text = s.title
                playerArtist.text = s.artist
                miniTitle.text = s.title
                miniArtist.text = s.artist
                albumArtView.setImageDrawable(null)
                miniArt.setImageDrawable(null)
                if (!s.isOnline) {
                    thumb(s, albumArtView, 600)
                    thumb(s, miniArt, 160)
                }
                refreshLyrics(s)
                songListView.invalidateViews()
            } else {
                refreshLyrics(s)
            }

            val playingNow = (c?.isPlaying == true) || fallbackPlaying
            val icon = if (playingNow) "Pausa" else "Play"
            playButton.text = icon
            miniPlay.text = icon
            shuffleButton.alpha = if (c?.shuffleModeEnabled == true || shuffleEnabled) 1f else 0.4f
            val repVal = c?.repeatMode ?: repeatMode
            repeatButton.alpha = if (repVal != Player.REPEAT_MODE_OFF) 1f else 0.4f
            repeatButton.text = if (repVal == Player.REPEAT_MODE_ONE) "Repetir 1" else "Repetir"
            favBtn.text = if (isFav(s)) "Fav OK" else "Fav"
        } catch (_: Exception) {}
    }

    private fun formatTime(durationMs: Long) = "%d:%02d".format(durationMs.coerceAtLeast(0L) / 60000, (durationMs.coerceAtLeast(0L) / 1000) % 60)

    private fun tick() {
        try {
            val c = ctrl
            val mp = fallbackPlayer
            var pos = 0L
            var dur = 0L
            if (c != null && c.currentMediaItem != null) {
                dur = c.duration
                pos = c.currentPosition
            } else if (mp != null && fallbackPrepared) {
                dur = try { mp.duration.toLong() } catch (_: Exception) { 0L }
                pos = try { mp.currentPosition.toLong() } catch (_: Exception) { 0L }
            }

            if (dur > 0L) {
                seekBarView.max = dur.toInt()
                seekBarView.progress = pos.coerceIn(0L, dur).toInt()
                timeLabel.text = "${formatTime(pos)} / ${formatTime(dur)}"
            }

            if (showLyrics && lyricLines.isNotEmpty() && lyricLines.any { it.timeMs > 0L }) {
                var idx = -1
                for (i in lyricLines.indices) {
                    if (lyricLines[i].timeMs <= pos) idx = i
                    else break
                }
                if (idx != currentLyricIndex) {
                    updateLyricHighlight(idx)
                }
            }

            if (sleepAt > 0L) {
                val left = sleepAt - System.currentTimeMillis()
                if (left <= 0L) {
                    sleepAt = 0L
                    try { ctrl?.pause() } catch (_: Exception) {}
                    try { if (fallbackPlayer?.isPlaying == true) fallbackPlayer?.pause() } catch (_: Exception) {}
                    fallbackPlaying = false
                    sleepBtn.text = "Dormir"
                    syncUi()
                } else {
                    sleepBtn.text = "Dormir ${left / 60000L + 1L}m"
                }
            }
        } catch (_: Exception) {}
        mainHandler.postDelayed({ tick() }, 400)
    }

    override fun onDestroy() {
        try {
            stopBgAnimation()
            mainHandler.removeCallbacksAndMessages(null)
            ctrl?.release()
            fallbackPlayer?.release()
        } catch (_: Exception) {}
        ctrl = null
        fallbackPlayer = null
        super.onDestroy()
    }

    @Deprecated("Deprecated in Java")
    override fun onBackPressed() {
        when {
            ::settingsView.isInitialized && settingsView.visibility == View.VISIBLE ->
                settingsView.visibility = View.GONE
            fullPlayer.visibility == View.VISIBLE -> {
                fullPlayer.visibility = View.GONE
                stopBgAnimation()
            }
            filterKind.isNotEmpty() -> {
                filterKind = ""
                filterValue = ""
                refresh()
            }
            else -> super.onBackPressed()
        }
    }
