name: Build L.E.B-M 1.6-beta

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack project and find Android root
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "MusicPlayer.zip" ]; then
            echo "Extracting MusicPlayer.zip..."
            mkdir -p unpacked
            unzip -oq MusicPlayer.zip -d unpacked
          fi

          PROJECT=""
          while IFS= read -r settings_file; do
            candidate="$(dirname "$settings_file")"
            if [ -d "$candidate/app" ]; then
              PROJECT="$candidate"
              break
            fi
          done < <(
            find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path './.git/*' \
              -not -path '*/.gradle/*' \
              | sort
          )

          if [ -z "$PROJECT" ]; then
            echo "::error::No Android project found. The repository or MusicPlayer.zip must contain settings.gradle(.kts) and an app/ folder."
            echo "Files found:"
            find . -maxdepth 5 -type f | head -100
            exit 1
          fi

          PROJECT="$(cd "$PROJECT" && pwd)"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT"
          ls -la "$PROJECT"
          ls -la "$PROJECT/app"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Install the Android SDK directly. This avoids the setup-android
      # action that failed in the previous workflow run.
      - name: Install Android command-line tools
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"

          curl --fail --location --retry 3 \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            --output "$RUNNER_TEMP/android-command-line-tools.zip"

          unzip -q "$RUNNER_TEMP/android-command-line-tools.zip" -d "$RUNNER_TEMP/android-tools"
          mkdir -p "$SDK_ROOT/cmdline-tools/latest"
          cp -R "$RUNNER_TEMP/android-tools/cmdline-tools/." "$SDK_ROOT/cmdline-tools/latest/"

          {
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "$SDK_ROOT/cmdline-tools/latest/bin"
            echo "$SDK_ROOT/platform-tools"
          } >> "$GITHUB_ENV"
          {
            echo "$SDK_ROOT/cmdline-tools/latest/bin"
            echo "$SDK_ROOT/platform-tools"
          } >> "$GITHUB_PATH"

          echo "Android SDK command-line tools installed."

      - name: Install Android SDK packages and licenses
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true

          sdkmanager --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          sdkmanager --sdk_root="$ANDROID_HOME" --list_installed

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Find and verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT/app/build/outputs/apk" \
            -type f -name '*.apk' 2>/dev/null | sort | head -n 1 || true)"

          if [ -z "$APK" ]; then
            echo "::error::Build completed but no APK was found."
            find "$PROJECT" -type f -name '*.apk' || true
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/L.E.B-M-1.6-beta.apk"
          unzip -t "$GITHUB_WORKSPACE/L.E.B-M-1.6-beta.apk"
          ls -lh "$GITHUB_WORKSPACE/L.E.B-M-1.6-beta.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: L.E.B-M-1.6-beta
          path: L.E.B-M-1.6-beta.apk
          if-no-files-found: error
          retention-days: 14
