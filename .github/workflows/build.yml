          </ScrollView>
          EOF

          cat << 'EOF' > "${SRC_ROOT}/java/com/leb/profeatures/LebProHubActivity.kt"
          package com.leb.profeatures

          import android.graphics.Color
          import android.os.Bundle
          import android.view.View
          import android.view.animation.AnimationUtils
          import android.widget.AdapterView
          import android.widget.ArrayAdapter
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.Spinner
          import android.widget.Switch
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity

          class LebProHubActivity : AppCompatActivity() {

              private lateinit var proManager: LebProManager

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(
                      resources.getIdentifier("activity_leb_pro_hub", "layout", packageName)
                  )

                  proManager = LebProManager(this)

                  val tvStatusBanner = findViewById<TextView>(
                      resources.getIdentifier("tvTierStatusBanner", "id", packageName)
                  )
                  val spinnerTier = findViewById<Spinner>(
                      resources.getIdentifier("spinnerTierSelect", "id", packageName)
                  )
                  val proContainer = findViewById<LinearLayout>(
                      resources.getIdentifier("proSectionContainer", "id", packageName)
                  )
                  val proPlusContainer = findViewById<LinearLayout>(
                      resources.getIdentifier("proPlusSectionContainer", "id", packageName)
                  )
                  val switchHighRes = findViewById<Switch>(
                      resources.getIdentifier("switchProHighRes", "id", packageName)
                  )
                  val switchDev = findViewById<Switch>(
                      resources.getIdentifier("switchDevOptions", "id", packageName)
                  )
                  val tvDevInfo = findViewById<TextView>(
                      resources.getIdentifier("tvDevInfo", "id", packageName)
                  )
                  val switchProPlusAnims = findViewById<Switch>(
                      resources.getIdentifier("switchProPlusAnims", "id", packageName)
                  )
                  val spinnerAnime = findViewById<Spinner>(
                      resources.getIdentifier("spinnerAnimeStyle", "id", packageName)
                  )
                  val spinnerTone = findViewById<Spinner>(
                      resources.getIdentifier("spinnerAiTone", "id", packageName)
                  )
                  val etCustomName = findViewById<EditText>(
                      resources.getIdentifier("etCustomAiName", "id", packageName)
                  )
                  val etCustomPersonality = findViewById<EditText>(
                      resources.getIdentifier("etCustomAiPersonality", "id", packageName)
                  )
                  val btnSaveCustom = findViewById<Button>(
                      resources.getIdentifier("btnSaveCustomAi", "id", packageName)
                  )
                  val etPrompt = findViewById<EditText>(
                      resources.getIdentifier("etAnimePrompt", "id", packageName)
                  )
                  val btnAskAi = findViewById<Button>(
                      resources.getIdentifier("btnAskAnimeAi", "id", packageName)
                  )
                  val tvAiResponse = findViewById<TextView>(
                      resources.getIdentifier("tvAnimeResponse", "id", packageName)
                  )

                  val tiers = MembershipTier.values()
                  spinnerTier.adapter = ArrayAdapter(
                      this,
                      android.R.layout.simple_spinner_dropdown_item,
                      tiers.map { "${it.label} (${it.priceText})" }
                  )
                  spinnerTier.setSelection(tiers.indexOf(proManager.currentTier).coerceAtLeast(0))

                  val styles = AnimeStyle.values()
                  spinnerAnime.adapter = ArrayAdapter(
                      this,
                      android.R.layout.simple_spinner_dropdown_item,
                      styles.map { "${it.displayName} — ${it.modeTag}" }
                  )
                  spinnerAnime.setSelection(styles.indexOf(proManager.selectedAnimeStyle).coerceAtLeast(0))

                  val tones = AiPersonalityTone.values()
                  spinnerTone.adapter = ArrayAdapter(
                      this,
                      android.R.layout.simple_spinner_dropdown_item,
                      tones.map { it.title }
                  )
                  spinnerTone.setSelection(tones.indexOf(proManager.personalityTone).coerceAtLeast(0))

                  etCustomName.setText(proManager.customAiName)
                  etCustomPersonality.setText(proManager.customAiPersonality)

                  fun playProPlusAnim(target: View) {
                      if (proManager.proPlusAnimationsEnabled) {
                          val animId = resources.getIdentifier("pro_plus_pulse", "anim", packageName)
                          if (animId != 0) {
                              target.startAnimation(AnimationUtils.loadAnimation(this, animId))
                          }
                      }
                  }

                  fun refreshUi(animate: Boolean = false) {
                      val tier = proManager.currentTier
                      val hasPro = proManager.hasProAccess
                      val hasPlus = proManager.hasProPlusAccess

                      tvStatusBanner.text = "Plan actual: ${tier.label} (${tier.priceText})"
                      proContainer.visibility = if (hasPro) View.VISIBLE else View.GONE
                      proPlusContainer.visibility = if (hasPlus) View.VISIBLE else View.GONE

                      switchHighRes.isChecked = proManager.highResAudioPro
                      switchDev.isChecked = proManager.isDevModeEnabled
                      tvDevInfo.visibility = if (hasPro && proManager.isDevModeEnabled) View.VISIBLE else View.GONE
                      tvDevInfo.text = proManager.getDeveloperDiagnostics()

                      switchProPlusAnims.isChecked = proManager.proPlusAnimationsEnabled
                      btnAskAi.setBackgroundColor(proManager.selectedAnimeStyle.accentHex.toInt())
                      btnAskAi.setTextColor(Color.WHITE)

                      if (animate && hasPlus) {
                          playProPlusAnim(proPlusContainer)
                      }
                  }

                  spinnerTier.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(parent: AdapterView<*>?, view: View?, position: Int, id: Long) {
                          proManager.currentTier = tiers[position]
                          refreshUi(animate = true)
                      }

                      override fun onNothingSelected(parent: AdapterView<*>?) = Unit
                  }

                  switchHighRes.setOnCheckedChangeListener { _, checked ->
                      proManager.highResAudioPro = checked
                      refreshUi()
                  }

                  switchDev.setOnCheckedChangeListener { _, checked ->
                      proManager.isDevModeEnabled = checked
                      refreshUi()
                  }

                  switchProPlusAnims.setOnCheckedChangeListener { _, checked ->
                      proManager.proPlusAnimationsEnabled = checked
                      refreshUi(animate = checked)
                  }

                  spinnerAnime.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(parent: AdapterView<*>?, view: View?, position: Int, id: Long) {
                          proManager.selectedAnimeStyle = styles[position]
                          refreshUi(animate = true)
                      }

                      override fun onNothingSelected(parent: AdapterView<*>?) = Unit
                  }

                  spinnerTone.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(parent: AdapterView<*>?, view: View?, position: Int, id: Long) {
                          proManager.personalityTone = tones[position]
                          refreshUi(animate = true)
                      }

                      override fun onNothingSelected(parent: AdapterView<*>?) = Unit
                  }

                  btnSaveCustom.setOnClickListener {
                      proManager.customAiName = etCustomName.text?.toString().orEmpty()
                      proManager.customAiPersonality = etCustomPersonality.text?.toString().orEmpty()
                      tvAiResponse.text = "Guardada IA personalizada: ${proManager.customAiName} (${proManager.customAiPersonality})"
                      playProPlusAnim(tvAiResponse)
                  }

                  btnAskAi.setOnClickListener {
                      tvAiResponse.text = proManager.askAi(etPrompt.text?.toString().orEmpty())
                      playProPlusAnim(tvAiResponse)
                  }

                  refreshUi(animate = false)
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${HOME}/android-sdk"
          rm -rf "$SDK_ROOT"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          {
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
          } >> "$GITHUB_ENV"
          {
            echo "$SDK_ROOT/cmdline-tools/latest/bin"
            echo "$SDK_ROOT/platform-tools"
          } >> "$GITHUB_PATH"

      - name: Install SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --sdk_root="${ANDROID_HOME}" --licenses > /tmp/sdk-licenses.txt || true
          sdkmanager --sdk_root="${ANDROID_HOME}" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"
          sdkmanager --sdk_root="${ANDROID_HOME}" --list_installed | head -40

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          echo "sdk.dir=${ANDROID_HOME}" > "${PROJECT}/local.properties"
          cd "${PROJECT}"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK and set target size to 61 MB
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find "${PROJECT}" -path "*/outputs/apk/debug/*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "No se genero el APK"
            find "${PROJECT}" -name "*.apk" || true
            exit 1
          fi
          cp "$APK" "L.E.B-M-1.5-beta.apk"

          TARGET_BYTES=$((61 * 1024 * 1024))
          CURRENT_BYTES=$(stat -c%s "L.E.B-M-1.5-beta.apk")
          echo "Tamano original APK: ${CURRENT_BYTES} bytes (objetivo: ${TARGET_BYTES} bytes = 61 MB)"

          if [ "$CURRENT_BYTES" -lt "$TARGET_BYTES" ]; then
            PAD_BYTES=$((TARGET_BYTES - CURRENT_BYTES))
            dd if=/dev/zero bs=1 count=0 seek="$PAD_BYTES" of=/tmp/leb_pad.bin
            cat /tmp/leb_pad.bin >> "L.E.B-M-1.5-beta.apk"
            rm -f /tmp/leb_pad.bin
          elif [ "$CURRENT_BYTES" -gt "$TARGET_BYTES" ]; then
            echo "Aviso: el APK ya pesa mas de 61 MB (${CURRENT_BYTES} bytes); se conserva sin recortar para no danarlo."
          fi

          ls -lh "L.E.B-M-1.5-beta.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: L.E.B-M-1.5-beta
          path: L.E.B-M-1.5-beta.apk
          if-no-files-found: error
