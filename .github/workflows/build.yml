name: Build L.E.B-M v1.3 APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate Android project
        run: |
          if [ -f MusicPlayer.zip ]; then
            mkdir -p leb_src
            unzip -q -o MusicPlayer.zip -d leb_src
            D=$(dirname "$(find leb_src \( -name settings.gradle -o -name settings.gradle.kts \) | head -n1)")
          else
            D=$(dirname "$(find . \( -name settings.gradle -o -name settings.gradle.kts \) -not -path './.git/*' | head -n1)")
          fi
          echo "PROJECT=$D" >> $GITHUB_ENV

      - name: Force version 1.3
        run: |
          python3 - << 'EOF'
          import glob, os, re

          root = os.environ["PROJECT"]
          patterns = ["**/build.gradle", "**/build.gradle.kts", "**/gradle.properties", "**/libs.versions.toml"]
          files = []
          for pat in patterns:
              files.extend(glob.glob(os.path.join(root, pat), recursive=True))

          for path in sorted(set(files)):
              if "/build/" in path or "\\build\\" in path:
                  continue
              with open(path, "r", encoding="utf-8", errors="ignore") as f:
                  text = f.read()

              new_text = text
              new_text = re.sub(r'(versionName\s*=?\s*["\'])([^"\']*)(["\'])', r'\g<1>1.3\g<3>', new_text)
              new_text = re.sub(r'(\bversionCode\s*=?\s*)(\d+)', r'\g<1>13', new_text)
              new_text = re.sub(r'(VERSION_NAME\s*=\s*["\']?)([^"\'\s]+)(["\']?)', r'\g<1>1.3\g<3>', new_text)
              new_text = re.sub(r'(VERSION_CODE\s*=\s*)(\d+)', r'\g<1>13', new_text)

              if new_text != text:
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(new_text)
                  print("ACTUALIZADO A 1.3:", path)
          EOF
          grep -rnE "versionName|versionCode|VERSION_NAME|VERSION_CODE" "$PROJECT" --exclude-dir=build || true

      - name: Generate launcher icon and L.E.B-M logo
        run: |
          python3 - << 'EOF'
          import math, os, struct, zlib

          res_dir = os.path.join(os.environ["PROJECT"], "app", "src", "main", "res")

          def make_png(size, is_logo=False):
              def chunk(tag, data):
                  return (
                      struct.pack("!I", len(data))
                      + tag
                      + data
                      + struct.pack("!I", zlib.crc32(tag + data) & 0xFFFFFFFF)
                  )

              cx, cy = (size - 1) / 2.0, (size - 1) / 2.0
              r_outer = size * 0.44
              r_inner = size * 0.22
              rows = []
              for y in range(size):
                  row = bytearray([0])
                  for x in range(size):
                      dist = math.hypot(x - cx, y - cy)
                      if not is_logo:
                          if dist <= r_outer:
                              if dist <= r_inner:
                                  r, g, b, a = 16, 22, 34, 255
                              else:
                                  t = (x + y) / max(1, 2 * size)
                                  r = int(16 + 24 * t)
                                  g = int(185 + 55 * (1 - t))
                                  b = int(145 + 85 * t)
                                  a = 255
                          else:
                              r, g, b, a = 12, 16, 24, 255
                      else:
                          if dist <= r_outer:
                              t = dist / max(1.0, r_outer)
                              r = int(20 + 40 * t)
                              g = int(210 - 60 * t)
                              b = int(150 + 70 * (1 - t))
                              a = 255
                          else:
                              r, g, b, a = 0, 0, 0, 0
                      row.extend((
                          max(0, min(255, r)),
                          max(0, min(255, g)),
                          max(0, min(255, b)),
                          max(0, min(255, a)),
                      ))
                  rows.append(bytes(row))

              raw = b"".join(rows)
              ihdr = struct.pack("!IIBBBBB", size, size, 8, 6, 0, 0, 0)
              return (
                  b"\x89PNG\r\n\x1a\n"
                  + chunk(b"IHDR", ihdr)
                  + chunk(b"IDAT", zlib.compress(raw, level=9))
                  + chunk(b"IEND", b"")
              )

          sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          for folder, px in sizes.items():
              out_dir = os.path.join(res_dir, f"mipmap-{folder}")
              os.makedirs(out_dir, exist_ok=True)
              for fname in ("ic_launcher.png", "ic_launcher_round.png"):
                  fpath = os.path.join(out_dir, fname)
                  if not os.path.exists(fpath):
                      with open(fpath, "wb") as f:
                          f.write(make_png(px, is_logo=False))

          drawable_dir = os.path.join(res_dir, "drawable")
          os.makedirs(drawable_dir, exist_ok=True)
          with open(os.path.join(drawable_dir, "leb_m_logo.png"), "wb") as f:
              f.write(make_png(256, is_logo=True))
          EOF

      - name: Ensure safe bilingual strings and credits
        run: |
          RES_DIR="$PROJECT/app/src/main/res"
          mkdir -p "$RES_DIR/values" "$RES_DIR/values-es"

          cat << 'EOF' > "$RES_DIR/values/strings.xml"
          <resources>
              <string name="app_name">L.E.B-M</string>
              <string name="created_by">Created by Lautaro and Claude</string>
              <string name="intro_nature">Nature mode loading...</string>
              <string name="search_hint">Search song (YouTube / Spotify / Local)</string>
              <string name="offline_banner">Offline mode: showing local/cached library</string>
              <string name="online_banner">Online mode: YouTube &amp; Spotify search ready</string>
              <string name="source_all">All</string>
              <string name="source_youtube">YouTube</string>
              <string name="source_spotify">Spotify</string>
              <string name="source_local">Local</string>
              <string name="lang_toggle">ES / EN</string>
          </resources>
          EOF

          cat << 'EOF' > "$RES_DIR/values-es/strings.xml"
          <resources>
              <string name="app_name">L.E.B-M</string>
              <string name="created_by">Creado por Lautaro y Claude</string>
              <string name="intro_nature">Cargando escena de naturaleza...</string>
              <string name="search_hint">Buscar canción (YouTube / Spotify / Local)</string>
              <string name="offline_banner">Sin Internet: modo local / caché activado</string>
              <string name="online_banner">Con Internet: búsqueda YouTube y Spotify lista</string>
              <string name="source_all">Todo</string>
              <string name="source_youtube">YouTube</string>
              <string name="source_spotify">Spotify</string>
              <string name="source_local">Local</string>
              <string name="lang_toggle">ES / EN</string>
          </resources>
          EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - run: gradle assembleDebug
        working-directory: ${{ env.PROJECT }}

      - run: cp "$PROJECT/app/build/outputs/apk/debug/app-debug.apk" L.E.B-M-v1.3.apk

      - uses: actions/upload-artifact@v4
        with:
          name: L.E.B-M-v1.3
          path: L.E.B-M-v1.3.apk
