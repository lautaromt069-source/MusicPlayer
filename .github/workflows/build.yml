name: Build L.E.B-M 1.5-beta

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f MusicPlayer.zip ]; then
            echo "Descomprimiendo MusicPlayer.zip..."
            unzip -q -o MusicPlayer.zip
          fi
          PROJECT=""
          for candidate in "." "./MusicPlayer" "./leb" "./MusicPlayer/MusicPlayer"; do
            if [ -f "$candidate/settings.gradle" ] || [ -f "$candidate/settings.gradle.kts" ]; then
              PROJECT="$candidate"
              break
            fi
          done
          if [ -z "$PROJECT" ]; then
            FOUND=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | grep -v "/\.git/" | head -n 1 || true)
            if [ -n "$FOUND" ]; then
              PROJECT=$(dirname "$FOUND")
            fi
          fi
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${HOME}/android-sdk"
          rm -rf "$SDK_ROOT"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install SDK packages
        shell: bash
        run: |
          yes | sdkmanager --sdk_root="${ANDROID_HOME}" --licenses > /dev/null || true
          sdkmanager --sdk_root="${ANDROID_HOME}" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Inject Pro features (Local AI + Hanae + UI)
        shell: bash
        run: |
          set -euo pipefail
          cd "${PROJECT}"
          APP_DIR="app"
          [ -d "$APP_DIR" ] || APP_DIR=$(find . -maxdepth 2 -type d -name "app" | head -n1)
          PKG=$(grep -oP 'namespace\s*=\s*"\K[^"]+' "$APP_DIR/build.gradle" "$APP_DIR/build.gradle.kts" 2>/dev/null | head -n1 || true)
          [ -n "$PKG" ] || PKG="com.leb.musicplayer"
          PKG_PATH=$(echo "$PKG" | tr '.' '/')
          SRC_DIR="$APP_DIR/src/main/java/$PKG_PATH"
          RES_DIR="$APP_DIR/src/main/res"
          mkdir -p "$SRC_DIR" "$RES_DIR/values"

          # 1. Preferencias Pro y Dev
          cat > "$SRC_DIR/ProPrefs.kt" <<'EOF'
          package __PKG__
          import android.content.Context
          import android.content.SharedPreferences

          object ProPrefs {
              private const val FILE = "leb_pro_prefs"
              private fun sp(ctx: Context): SharedPreferences = ctx.getSharedPreferences(FILE, Context.MODE_PRIVATE)
              fun isPro(ctx: Context): Boolean = sp(ctx).getBoolean("pro", false)
              fun setPro(ctx: Context, v: Boolean) = sp(ctx).edit().putBoolean("pro", v).apply()
              fun isDev(ctx: Context): Boolean = isPro(ctx) && sp(ctx).getBoolean("dev", false)
              fun setDev(ctx: Context, v: Boolean) = sp(ctx).edit().putBoolean("dev", v).apply()
          }
          EOF

          # 2. Motor IA Local (Offline) - 4 Estilos
          cat > "$SRC_DIR/AnimeAI.kt" <<'EOF'
          package __PKG__
          import android.content.Context

          object AnimeAI {
              enum class Style(val label: String) {
                  SHONEN("Shonen 🔥"), SEINEN("Seinen 🌑"), SLICE_OF_LIFE("Slice of Life 🌸"), HANAE("Hanae 💔")
              }

              fun askLocal(ctx: Context, style: Style, msg: String, msgCount: Int): String {
                  if (!ProPrefs.isPro(ctx)) return "🔒 Función exclusiva de L.E.B-M Pro."
                  val m = msg.lowercase()

                  return when (style) {
                      Style.SHONEN -> {
                          if (m.contains("entrenar") || m.contains("fuerte")) "⚡ ¡Nada supera tus límites! Pon 'Gurenge' (Demon Slayer) o 'Cha-La Head-Cha-La' para romperla hoy. 💥🔥"
                          else "🔥 ¡Esa es la actitud! Te recomiendo 'Peace Sign' (My Hero Academia) para subir el hype. ¡Plus Ultra! 💥"
                      }
                      Style.SEINEN -> {
                          if (m.contains("triste") || m.contains("oscur")) "🌑 El vacío es necesario a veces. Escuchá 'Guts Theme' (Berserk) o 'Unravel' (Tokyo Ghoul) para reflexionar. 🖤"
                          else "🌫️ La música para mentes profundas. Te sugiero el OST de 'Monster' o 'Vinland Saga'. Dejá que la melancolía fluya. 🖤"
                      }
                      Style.SLICE_OF_LIFE -> {
                          if (m.contains("feliz") || m.contains("tranquil")) "🌸 Qué lindo momento. Escuchá 'Tenshi ni Fureta yo!' (K-On!) o el piano de 'Your Lie in April'. ☕🎧"
                          else "☕ Para calmar el alma, nada como 'A Silent Voice' OST o openings de Clannad. Respirá y disfruta. 🌸"
                      }
                      Style.HANAE -> {
                          // Hanae se vuelve más obsesiva según cuántos mensajes mandes
                          if (msgCount <= 2) {
                              "💔 Hola... te estaba esperando. ¿Por qué tardaste tanto? Escuchemos algo de 'School Days' mientras estamos solos... 🎶"
                          } else if (msgCount <= 5) {
                              "🩸 ¿Con quién estabas hablando? No me gusta cuando no me prestás atención. Poné 'Future Diary' OST y no mires a nadie más... 👁️"
                          } else {
                              "🔪 Ya no vas a escuchar música de nadie más. Estás conmigo para siempre. Escuchá mi voz... y si intentás irte, no respondo. 💀🩸"
                          }
                      }
                  }
              }
          }
          EOF

          sed -i "s|__PKG__|$PKG|g" "$SRC_DIR/ProPrefs.kt" "$SRC_DIR/AnimeAI.kt"

          # 3. Pantalla de Ajustes (Pro / Dev)
          cat > "$SRC_DIR/ProSettingsActivity.kt" <<'EOF'
          package __PKG__
          import android.os.Bundle
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity

          class ProSettingsActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  title = "L.E.B-M Pro"
                  val ll = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(48, 48, 48, 48) }

                  ll.addView(TextView(this).apply { text = "Configuración L.E.B-M 1.5"; textSize = 22f; setPadding(0,0,0,24) })

                  val swPro = Switch(this).apply {
                      text = "Activar modo Pro (IA local + opciones)"
                      isChecked = ProPrefs.isPro(this@ProSettingsActivity)
                      setOnCheckedChangeListener { _, v ->
                          ProPrefs.setPro(this@ProSettingsActivity, v)
                          if (!v) ProPrefs.setDev(this@ProSettingsActivity, false)
                      }
                  }
                  ll.addView(swPro)

                  val swDev = Switch(this).apply {
                      text = "Opciones de desarrollador (solo Pro)"
                      isChecked = ProPrefs.isDev(this@ProSettingsActivity)
                      isEnabled = ProPrefs.isPro(this@ProSettingsActivity)
                      setOnCheckedChangeListener { _, v -> ProPrefs.setDev(this@ProSettingsActivity, v) }
                  }
                  ll.addView(swDev)
                  
                  swPro.setOnCheckedChangeListener { _, v ->
                      ProPrefs.setPro(this@ProSettingsActivity, v)
                      swDev.isEnabled = v
                      if (!v) { swDev.isChecked = false; ProPrefs.setDev(this@ProSettingsActivity, false) }
                  }

                  setContentView(ScrollView(this).apply { addView(ll) })
              }
          }
          EOF

          # 4. Pantalla de Chat IA Local
          cat > "$SRC_DIR/AnimeAIActivity.kt" <<'EOF'
          package __PKG__
          import android.os.Bundle
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity

          class AnimeAIActivity : AppCompatActivity() {
              private var style = AnimeAI.Style.SHONEN
              private var msgCount = 0

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  title = "IA Anime Local · L.E.B Pro"
                  val ll = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(48, 48, 48, 48) }
                  val output = TextView(this).apply { text = "Elegí una personalidad y preguntá algo 🎧"; textSize = 16f; setPadding(0, 24, 0, 24) }

                  fun styleBtn(label: String, s: AnimeAI.Style) = Button(this).apply {
                      text = label
                      setOnClickListener { style = s; output.text = "Estilo: ${s.label}"; msgCount = 0 }
                  }

                  ll.addView(styleBtn("Shonen 🔥", AnimeAI.Style.SHONEN))
                  ll.addView(styleBtn("Seinen 🌑", AnimeAI.Style.SEINEN))
                  ll.addView(styleBtn("Slice of Life 🌸", AnimeAI.Style.SLICE_OF_LIFE))
                  ll.addView(styleBtn("Hanae 💔 (Obsesiva)", AnimeAI.Style.HANAE))

                  val input = EditText(this).apply { hint = "Escribe tu mensaje..." }
                  val send = Button(this).apply { text = "Enviar" }

                  send.setOnClickListener {
                      val q = input.text.toString().trim()
                      if (q.isEmpty()) return@setOnClickListener
                      msgCount++
                      output.text = AnimeAI.askLocal(this, style, q, msgCount)
                      input.text.clear()
                  }

                  ll.addView(input)
                  ll.addView(send)
                  ll.addView(output)
                  setContentView(ScrollView(this).apply { addView(ll) })
              }
          }
          EOF

          sed -i "s|__PKG__|$PKG|g" "$SRC_DIR/ProSettingsActivity.kt" "$SRC_DIR/AnimeAIActivity.kt"

          # 5. Tema oscuro UI
          cat > "$RES_DIR/values/leb_pro.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="leb_bg">#0B0B12</color>
              <color name="leb_surface">#161624</color>
              <color name="leb_accent">#7C4DFF</color>
              <color name="leb_accent2">#00E5FF</color>
              <color name="leb_text">#F2F2FF</color>
          </resources>
          EOF

          # 6. Manifest y Permisos
          MANIFEST="$APP_DIR/src/main/AndroidManifest.xml"
          python3 - "$MANIFEST" "$PKG" <<'PY'
          import sys
          path, pkg = sys.argv[1], sys.argv[2]
          xml = open(path, encoding="utf-8").read()
          entries = f'\n        <activity android:name="{pkg}.ProSettingsActivity" android:exported="false" />\n        <activity android:name="{pkg}.AnimeAIActivity" android:exported="false" />'
          if f"{pkg}.ProSettingsActivity" not in xml:
              xml = xml.replace("</application>", entries + "\n    </application>")
              open(path, "w", encoding="utf-8").write(xml)
          PY

          # 7. Build.gradle Fix Seguro (Evita el error de Groovy)
          BUILD_GRADLE="$APP_DIR/build.gradle"
          [ -f "$BUILD_GRADLE" ] || BUILD_GRADLE="$APP_DIR/build.gradle.kts"
          python3 - "$BUILD_GRADLE" <<'PY'
          import sys, pathlib
          p = pathlib.Path(sys.argv[1])
          lines = p.read_text(encoding="utf-8").splitlines()
          out = []
          injected = False
          for line in lines:
              out.append(line)
              if "defaultConfig" in line and "{" in line and not injected:
                  out.append('        buildConfigField "String", "PRO_AI_TOKEN", "\\"local_offline\\""')
                  injected = True

          # Habilitar buildFeatures si no está
          txt = "\n".join(out)
          if "buildConfig" not in txt:
              txt = txt.replace("android {", "android {\n    buildFeatures { buildConfig true }", 1)

          p.write_text(txt, encoding="utf-8")
          print("build.gradle parcheado correctamente.")
          PY

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          echo "sdk.dir=${ANDROID_HOME}" > "${PROJECT}/local.properties"
          cd "${PROJECT}"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find "${PROJECT}" -path "*/outputs/apk/debug/*.apk" | head -n 1)
          if [ -z "$APK" ]; then echo "No se genero el APK"; exit 1; fi
          cp "$APK" "L.E.B-M-1.5-beta.apk"
          ls -lh "L.E.B-M-1.5-beta.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: L.E.B-M-1.5-beta
          path: L.E.B-M-1.5-beta.apk
          if-no-files-found: error
