name: Build L.E.B-M 1.5-beta

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f MusicPlayer.zip ]; then
            echo "Descomprimiendo MusicPlayer.zip..."
            unzip -q -o MusicPlayer.zip
          fi
          PROJECT=""
          for candidate in "." "./MusicPlayer" "./leb" "./MusicPlayer/MusicPlayer"; do
            if [ -f "$candidate/settings.gradle" ] || [ -f "$candidate/settings.gradle.kts" ]; then
              PROJECT="$candidate"
              break
            fi
          done
          if [ -z "$PROJECT" ]; then
            FOUND=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | grep -v "/\.git/" | head -n 1 || true)
            if [ -n "$FOUND" ]; then
              PROJECT=$(dirname "$FOUND")
            fi
          fi
          if [ -z "$PROJECT" ]; then
            echo "ERROR: no se encontro settings.gradle"
            find . -maxdepth 5 -type f | head -80
            exit 1
          fi
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Proyecto: $PROJECT"
          ls -la "$PROJECT"
          ls -la "$PROJECT/app" || true

      - name: Inject Pro ($3), Pro+ ($5), Anime AI, Custom AI, Dev Mode & Icon
        shell: bash
        run: |
          set -euo pipefail
          SRC_ROOT="${PROJECT}/app/src/main"
          export SRC_ROOT
          mkdir -p "${SRC_ROOT}/java/com/leb/profeatures" "${SRC_ROOT}/res/layout" "${SRC_ROOT}/res/anim"

          ICON_URL="https://encrypted-tbn1.gstatic.com/licensed-image?q=tbn:ANd9GcQioRZFHG8GZT52oPpz7pP51dpWamWLblkVk84cKN2O9xXbNhULp1Q4KG_5d16WBLWB6BnTBWg7vGYB6Ng"
          curl -fsSL -o /tmp/leb_icon_raw.jpg "$ICON_URL"

          python3 - << 'PYEOF'
          import os, pathlib, shutil, struct, zlib, xml.etree.ElementTree as ET

          src_root = pathlib.Path(os.environ["SRC_ROOT"])
          raw_img = pathlib.Path("/tmp/leb_icon_raw.jpg")

          def make_solid_png(width: int, height: int, r: int, g: int, b: int) -> bytes:
              def chunk(tag: bytes, data: bytes) -> bytes:
                  crc = zlib.crc32(tag + data) & 0xFFFFFFFF
                  return struct.pack("!I", len(data)) + tag + data + struct.pack("!I", crc)
              ihdr = struct.pack("!IIBBBBB", width, height, 8, 2, 0, 0, 0)
              row = bytes([r, g, b]) * width
              raw_data = b"".join(b"\x00" + row for _ in range(height))
              idat = zlib.compress(raw_data, level=6)
              return b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", idat) + chunk(b"IEND", b"")

          png_bytes = None
          try:
              from PIL import Image
              with Image.open(raw_img) as im:
                  rgba = im.convert("RGBA")
                  w, h = rgba.size
                  side = min(w, h)
                  left = (w - side) // 2
                  top = (h - side) // 2
                  square = rgba.crop((left, top, left + side, top + side)).resize((512, 512), Image.Resampling.LANCZOS)
                  import io
                  buf = io.BytesIO()
                  square.save(buf, format="PNG")
                  png_bytes = buf.getvalue()
          except Exception:
              png_bytes = None

          if png_bytes is None:
              png_bytes = make_solid_png(192, 192, 18, 185, 214)

          for anydpi in ["mipmap-anydpi-v26", "mipmap-anydpi"]:
              d = src_root / "res" / anydpi
              if d.exists():
                  shutil.rmtree(d)

          for density in ["mipmap-mdpi", "mipmap-hdpi", "mipmap-xhdpi", "mipmap-xxhdpi", "mipmap-xxxhdpi"]:
              target_dir = src_root / "res" / density
              target_dir.mkdir(parents=True, exist_ok=True)
              for xml_name in ["ic_launcher.xml", "ic_launcher_round.xml"]:
                  xml_file = target_dir / xml_name
                  if xml_file.exists():
                      xml_file.unlink()
              for png_name in ["ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"]:
                  (target_dir / png_name).write_bytes(png_bytes)

          manifest_path = src_root / "AndroidManifest.xml"
          if manifest_path.exists():
              ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
              tree = ET.parse(manifest_path)
              root = tree.getroot()
              app = root.find("application")
              if app is not None:
                  app.set("{http://schemas.android.com/apk/res/android}icon", "@mipmap/ic_launcher")
                  app.set("{http://schemas.android.com/apk/res/android}roundIcon", "@mipmap/ic_launcher_round")
                  exists = any(
                      act.attrib.get("{http://schemas.android.com/apk/res/android}name") == "com.leb.profeatures.LebProHubActivity"
                      for act in app.findall("activity")
                  )
                  if not exists:
                      act = ET.SubElement(app, "activity")
                      act.set("{http://schemas.android.com/apk/res/android}name", "com.leb.profeatures.LebProHubActivity")
                      act.set("{http://schemas.android.com/apk/res/android}exported", "false")
                  tree.write(manifest_path, encoding="utf-8", xml_declaration=True)
          PYEOF

          cat << 'EOF' > "${SRC_ROOT}/res/anim/pro_plus_pulse.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <set xmlns:android="http://schemas.android.com/apk/res/android"
              android:interpolator="@android:anim/accelerate_decelerate_interpolator">
              <scale
                  android:duration="320"
                  android:fromXScale="0.96"
                  android:fromYScale="0.96"
                  android:toXScale="1.02"
                  android:toYScale="1.02"
                  android:pivotX="50%"
                  android:pivotY="50%" />
              <alpha
                  android:duration="320"
                  android:fromAlpha="0.75"
                  android:toAlpha="1.0" />
          </set>
          EOF

          cat << 'EOF' > "${SRC_ROOT}/java/com/leb/profeatures/LebProManager.kt"
          package com.leb.profeatures

          import android.content.Context

          enum class MembershipTier(val label: String, val priceText: String) {
              FREE("Gratis", "$0"),
              PRO("Pro", "$3 USD"),
              PRO_PLUS("Pro+", "$5 USD")
          }

          enum class AnimeStyle(
              val displayName: String,
              val modeTag: String,
              val accentHex: Long
          ) {
              SHONEN("Shonen", "Energía, foco y motivación", 0xFFE53935),
              SLICE_OF_LIFE("Slice of Life", "Calma, cercanía y ambiente cotidiano", 0xFF43A047),
              CYBERPUNK_SCIFI("Cyberpunk / Sci-Fi", "Precisión técnica y estilo futurista", 0xFF00ACC1),
              CUSTOM("Mi IA Personalizada", "Creada por el usuario en Pro+", 0xFF8E24AA)
          }

          enum class AiPersonalityTone(val title: String) {
              BALANCED("Equilibrado"),
              INTENSE("Intenso / Directo"),
              CALM("Suave / Cercano"),
              ANALYTICAL("Técnico / Analítico")
          }

          class LebProManager(context: Context) {
              private val prefs = context.getSharedPreferences("leb_pro_plus_prefs", Context.MODE_PRIVATE)

              var currentTier: MembershipTier
                  get() {
                      val raw = prefs.getString("membership_tier", MembershipTier.FREE.name) ?: MembershipTier.FREE.name
                      return runCatching { MembershipTier.valueOf(raw) }.getOrDefault(MembershipTier.FREE)
                  }
                  set(value) {
                      prefs.edit().putString("membership_tier", value.name).apply()
                      if (value == MembershipTier.FREE) {
                          prefs.edit().putBoolean("dev_mode_enabled", false).apply()
                      }
                  }

              val hasProAccess: Boolean
                  get() = currentTier == MembershipTier.PRO || currentTier == MembershipTier.PRO_PLUS

              val hasProPlusAccess: Boolean
                  get() = currentTier == MembershipTier.PRO_PLUS

              var selectedAnimeStyle: AnimeStyle
                  get() {
                      val raw = prefs.getString("anime_style", AnimeStyle.SHONEN.name) ?: AnimeStyle.SHONEN.name
                      return runCatching { AnimeStyle.valueOf(raw) }.getOrDefault(AnimeStyle.SHONEN)
                  }
                  set(value) = prefs.edit().putString("anime_style", value.name).apply()

              var personalityTone: AiPersonalityTone
                  get() {
                      val raw = prefs.getString("ai_tone", AiPersonalityTone.BALANCED.name) ?: AiPersonalityTone.BALANCED.name
                      return runCatching { AiPersonalityTone.valueOf(raw) }.getOrDefault(AiPersonalityTone.BALANCED)
                  }
                  set(value) {
                      if (hasProPlusAccess) {
                          prefs.edit().putString("ai_tone", value.name).apply()
                      }
                  }

              var customAiName: String
                  get() = prefs.getString("custom_ai_name", "Nova-X") ?: "Nova-X"
                  set(value) {
                      if (hasProPlusAccess) {
                          val clean = value.trim().ifEmpty { "Nova-X" }
                          prefs.edit().putString("custom_ai_name", clean).apply()
                      }
                  }

              var customAiPersonality: String
                  get() = prefs.getString("custom_ai_personality", "Aliado creativo y directo") ?: "Aliado creativo y directo"
                  set(value) {
                      if (hasProPlusAccess) {
                          val clean = value.trim().ifEmpty { "Aliado creativo y directo" }
                          prefs.edit().putString("custom_ai_personality", clean).apply()
                      }
                  }

              var proPlusAnimationsEnabled: Boolean
                  get() = hasProPlusAccess && prefs.getBoolean("pro_plus_anims", true)
                  set(value) {
                      if (hasProPlusAccess) {
                          prefs.edit().putBoolean("pro_plus_anims", value).apply()
                      }
                  }

              var isDevModeEnabled: Boolean
                  get() = hasProAccess && prefs.getBoolean("dev_mode_enabled", false)
                  set(value) {
                      if (hasProAccess) {
                          prefs.edit().putBoolean("dev_mode_enabled", value).apply()
                      }
                  }

              var highResAudioPro: Boolean
                  get() = hasProAccess && prefs.getBoolean("high_res_audio_pro", true)
                  set(value) {
                      if (hasProAccess) {
                          prefs.edit().putBoolean("high_res_audio_pro", value).apply()
                      }
                  }

              fun askAi(prompt: String): String {
                  if (!hasProPlusAccess) {
                      return "Función exclusiva de Pro+ ($5 USD): activa Pro+ para usar las 3 IA de anime, cambiar personalidades o usar tu IA propia."
                  }
                  val cleanPrompt = if (prompt.isBlank()) "tu sesión actual" else prompt.trim()
                  val tonePrefix = "[Tono: ${personalityTone.title}]"

                  return when (selectedAnimeStyle) {
                      AnimeStyle.SHONEN ->
                          "[Shonen • Pro+] $tonePrefix ¡A darlo todo! Para \"$cleanPrompt\", sube la intensidad y mantén el ritmo."
                      AnimeStyle.SLICE_OF_LIFE ->
                          "[Slice of Life • Pro+] $tonePrefix Momento tranquilo: para \"$cleanPrompt\", un ambiente cálido y pausado encaja mejor."
                      AnimeStyle.CYBERPUNK_SCIFI ->
                          "[Cyberpunk / Sci-Fi • Pro+] $tonePrefix Enlace activo sobre \"$cleanPrompt\": pulsos electrónicos y enfoque preciso."
                      AnimeStyle.CUSTOM ->
                          "[$customAiName ($customAiPersonality) • Pro+] $tonePrefix Para \"$cleanPrompt\": respuesta adaptada a tu IA personal."
                  }
              }

              fun getDeveloperDiagnostics(): String {
                  if (!hasProAccess) {
                      return "Modo desarrollador bloqueado: activa Pro ($3 USD) o Pro+ ($5 USD)."
                  }
                  return "DEV_MODE=ACTIVE | TIER=${currentTier.name} (${currentTier.priceText}) | HIRES=$highResAudioPro | STYLE=${selectedAnimeStyle.name} | TONE=${personalityTone.name}"
              }
          }
          EOF

          cat << 'EOF' > "${SRC_ROOT}/res/layout/activity_leb_pro_hub.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/scrollProRoot"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#121212"
              android:padding="16dp">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical">

                  <TextView
                      android:id="@+id/tvHubTitle"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="L.E.B-M 1.5-beta • Pro ($3) &amp; Pro+ ($5)"
                      android:textColor="#FFFFFF"
                      android:textSize="21sp"
                      android:textStyle="bold"
                      android:paddingBottom="6dp" />

                  <TextView
                      android:id="@+id/tvTierStatusBanner"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Plan actual: Gratis ($0)"
                      android:textColor="#BDBDBD"
                      android:textSize="14sp"
                      android:paddingBottom="10dp" />

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Cambiar nivel (Gratis $0 / Pro $3 / Pro+ $5):"
                      android:textColor="#E0E0E0"
                      android:textStyle="bold"
                      android:paddingBottom="4dp" />

                  <Spinner
                      android:id="@+id/spinnerTierSelect"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:background="#262626"
                      android:padding="8dp"
                      android:layout_marginBottom="14dp" />

                  <LinearLayout
                      android:id="@+id/proSectionContainer"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:background="#1C1C1C"
                      android:orientation="vertical"
                      android:padding="14dp"
                      android:layout_marginBottom="14dp">

                      <TextView
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="Opciones Pro ($3 USD) + Modo Desarrollador"
                          android:textColor="#FFFFFF"
                          android:textSize="17sp"
                          android:textStyle="bold"
                          android:paddingBottom="8dp" />

                      <Switch
                          android:id="@+id/switchProHighRes"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="Perfil de audio Pro avanzado"
                          android:textColor="#E0E0E0"
                          android:paddingBottom="10dp" />

                      <Switch
                          android:id="@+id/switchDevOptions"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="Modo desarrollador (Solo Pro / Pro+)"
                          android:textColor="#80DEEA" />

                      <TextView
                          android:id="@+id/tvDevInfo"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text=""
                          android:textColor="#80DEEA"
                          android:paddingTop="8dp" />
                  </LinearLayout>

                  <LinearLayout
                      android:id="@+id/proPlusSectionContainer"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:background="#221A2B"
                      android:orientation="vertical"
                      android:padding="14dp">

                      <TextView
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="Exclusivo Pro+ ($5 USD) • 3 IA Anime + IA Propia + Animaciones"
                          android:textColor="#F3E5F5"
                          android:textSize="17sp"
                          android:textStyle="bold"
                          android:paddingBottom="8dp" />

                      <Switch
                          android:id="@+id/switchProPlusAnims"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="Animaciones exclusivas Pro+"
                          android:textColor="#E1BEE7"
                          android:paddingBottom="10dp" />

                      <TextView
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="Elegir IA (Shonen / Slice of Life / Cyberpunk Sci-Fi / Mi IA):"
                          android:textColor="#FFFFFF"
                          android:textStyle="bold"
                          android:paddingBottom="4dp" />

                      <Spinner
                          android:id="@+id/spinnerAnimeStyle"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:background="#31243D"
                          android:padding="6dp"
                          android:layout_marginBottom="10dp" />

                      <TextView
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="Personalidad de la IA:"
                          android:textColor="#FFFFFF"
