name: Build L.E.B-M 1.5-beta

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f MusicPlayer.zip ]; then
            echo "Descomprimiendo MusicPlayer.zip..."
            unzip -q -o MusicPlayer.zip
          fi
          PROJECT=""
          for candidate in "." "./MusicPlayer" "./leb" "./MusicPlayer/MusicPlayer"; do
            if [ -f "$candidate/settings.gradle" ] || [ -f "$candidate/settings.gradle.kts" ]; then
              PROJECT="$candidate"
              break
            fi
          done
          if [ -z "$PROJECT" ]; then
            FOUND=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | grep -v "/\.git/" | head -n 1 || true)
            if [ -n "$FOUND" ]; then
              PROJECT=$(dirname "$FOUND")
            fi
          fi
          if [ -z "$PROJECT" ]; then
            echo "ERROR: no se encontro settings.gradle"
            find . -maxdepth 5 -type f | head -80
            exit 1
          fi
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Proyecto: $PROJECT"
          ls -la "$PROJECT"
          ls -la "$PROJECT/app" || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${HOME}/android-sdk"
          rm -rf "$SDK_ROOT"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          {
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
          } >> "$GITHUB_ENV"
          {
            echo "$SDK_ROOT/cmdline-tools/latest/bin"
            echo "$SDK_ROOT/platform-tools"
          } >> "$GITHUB_PATH"

      - name: Install SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --sdk_root="${ANDROID_HOME}" --licenses > /tmp/sdk-licenses.txt || true
          sdkmanager --sdk_root="${ANDROID_HOME}" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"
          sdkmanager --sdk_root="${ANDROID_HOME}" --list_installed | head -40

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # ─────────────────────────────────────────────────────────────
      # INYECCIÓN DE FEATURES PRO (IA + UI + TOGGLE PRO/DEV)
      # ─────────────────────────────────────────────────────────────
      - name: Inject Pro features (AI + UI + Pro/Dev toggle)
        shell: bash
        env:
          PRO_AI_BASE: "https://api.deepinfra.com/v1/openai"
          PRO_AI_MODEL: "meta-llama/Meta-Llama-3.1-8B-Instruct"
        run: |
          set -euo pipefail
          cd "${PROJECT}"

          # Detectar módulo app
          APP_DIR="app"
          [ -d "$APP_DIR" ] || APP_DIR=$(find . -maxdepth 2 -type d -name "app" | head -n1)
          PKG=$(grep -oP 'namespace\s*=\s*"\K[^"]+' "$APP_DIR/build.gradle" "$APP_DIR/build.gradle.kts" 2>/dev/null | head -n1 || true)
          [ -n "$PKG" ] || PKG="com.leb.musicplayer"
          PKG_PATH=$(echo "$PKG" | tr '.' '/')
          SRC_DIR="$APP_DIR/src/main/java/$PKG_PATH"
          RES_DIR="$APP_DIR/src/main/res"
          mkdir -p "$SRC_DIR" "$RES_DIR/values" "$RES_DIR/drawable" "$RES_DIR/mipmap-anydpi-v26" "$RES_DIR/layout"

          echo "PKG=$PKG"
          echo "SRC_DIR=$SRC_DIR"

          # ── 1) Preferencias Pro / Dev (persistencia) ─────────────
          cat > "$SRC_DIR/ProPrefs.kt" <<'EOF'
          package __PKG__

          import android.content.Context
          import android.content.SharedPreferences

          object ProPrefs {
              private const val FILE = "leb_pro_prefs"
              private const val KEY_PRO = "pro_enabled"
              private const val KEY_DEV = "dev_enabled"

              private fun sp(ctx: Context): SharedPreferences =
                  ctx.getSharedPreferences(FILE, Context.MODE_PRIVATE)

              fun isPro(ctx: Context): Boolean = sp(ctx).getBoolean(KEY_PRO, false)
              fun setPro(ctx: Context, v: Boolean) = sp(ctx).edit().putBoolean(KEY_PRO, v).apply()

              // Dev options SOLO si Pro está activo
              fun isDev(ctx: Context): Boolean = isPro(ctx) && sp(ctx).getBoolean(KEY_DEV, false)
              fun setDev(ctx: Context, v: Boolean) = sp(ctx).edit().putBoolean(KEY_DEV, v).apply()
          }
          EOF

          # ── 2) Motor IA: 3 estilos de anime ─────────────────────
          #  - Shonen  (acción, energía, hype)        -> Naruto/DBZ/One Piece
          #  - Seinen  (oscuro, profundo, psicológico)-> Berserk/Monster/Tokyo Ghoul
          #  - Slice of Life (calma, emocional)       -> Clannad/K-On/A Silent Voice
          cat > "$SRC_DIR/AnimeAI.kt" <<'EOF'
          package __PKG__

          import android.content.Context
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL

          /**
           * Motor IA L.E.B Pro — 3 personalidades de anime:
           *  SHONEN        -> energía, hype, recomendaciones intensas (Naruto, DBZ, One Piece)
           *  SEINEN        -> oscuro, profundo, psicológico (Berserk, Monster, Tokyo Ghoul)
           *  SLICE_OF_LIFE -> tranquilo, emocional, cotidiano (Clannad, K-On!, A Silent Voice)
           *
           * Solo disponible si ProPrefs.isPro(ctx) == true.
           */
          object AnimeAI {

              enum class Style(val label: String, val system: String) {
                  SHONEN(
                      "Shonen 🔥",
                      "Eres un DJ asistente estilo SHONEN anime. Hablas con energía, hype y frases " +
                      "motivadoras (Naruto, Dragon Ball Z, One Piece, My Hero Academia). " +
                      "Recomiendas música épica, openings y canciones con drop para entrenar o animarte. " +
                      "Respuestas cortas (máx 3 líneas), con emojis ⚡🔥💥."
                  ),
                  SEINEN(
                      "Seinen 🌑",
                      "Eres un curador musical estilo SEINEN anime. Tono profundo, reflexivo y " +
                      "ligeramente oscuro (Berserk, Monster, Tokyo Ghoul, Vinland Saga). " +
                      "Recomiendas música atmosférica, lo-fi oscuro, post-rock y openings melancólicos. " +
                      "Respuestas cortas (máx 3 líneas), con emojis 🌑🖤🌫️."
                  ),
                  SLICE_OF_LIFE(
                      "Slice of Life 🌸",
                      "Eres un compañero musical estilo SLICE OF LIFE anime. Tono cálido, tranquilo " +
                      "y emocional (Clannad, K-On!, A Silent Voice, Your Lie in April). " +
                      "Recomiendas música acústica, indie pop, piano y openings suaves. " +
                      "Respuestas cortas (máx 3 líneas), con emojis 🌸☕🎧."
                  )
              }

              // Endpoint compatible OpenAI — el token se toma de BuildConfig.PRO_AI_TOKEN
              private const val BASE_URL = "__BASE__"
              private const val MODEL = "__MODEL__"

              suspend fun ask(
                  ctx: Context,
                  style: Style,
                  userMessage: String
              ): String = withContext(Dispatchers.IO) {
                  if (!ProPrefs.isPro(ctx)) {
                      return@withContext "🔒 Función exclusiva de L.E.B-M Pro."
                  }
                  val token = BuildConfig.PRO_AI_TOKEN
                  if (token.isBlank()) {
                      return@withContext "⚠️ Falta PRO_AI_TOKEN en la build (secreto)."
                  }
                  try {
                      val url = URL("$BASE_URL/chat/completions")
                      val conn = url.openConnection() as HttpURLConnection
                      conn.requestMethod = "POST"
                      conn.setRequestProperty("Content-Type", "application/json")
                      conn.setRequestProperty("Authorization", "Bearer $token")
                      conn.doOutput = true
                      conn.connectTimeout = 15000
                      conn.readTimeout = 20000

                      val messages = JSONArray().apply {
                          put(JSONObject().put("role", "system").put("content", style.system))
                          put(JSONObject().put("role", "user").put("content", userMessage))
                      }
                      val body = JSONObject()
                          .put("model", MODEL)
                          .put("messages", messages)
                          .put("max_tokens", 180)
                          .put("temperature", 0.8)
                          .toString()

                      conn.outputStream.use { it.write(body.toByteArray()) }
                      val code = conn.responseCode
                      val stream = if (code in 200..299) conn.inputStream else conn.errorStream
                      val resp = stream.bufferedReader().readText()
                      if (code !in 200..299) return@withContext "⚠️ IA ($code): ${resp.take(120)}"

                      val content = JSONObject(resp)
                          .getJSONArray("choices")
                          .getJSONObject(0)
                          .getJSONObject("message")
                          .getString("content")
                          .trim()
                      content
                  } catch (e: Exception) {
                      "⚠️ Error IA: ${e.message?.take(120) ?: "desconocido"}"
                  }
              }
          }
          EOF

          # Reemplazar tokens
          sed -i "s|__PKG__|$PKG|g" "$SRC_DIR/ProPrefs.kt" "$SRC_DIR/AnimeAI.kt"
          sed -i "s|__BASE__|${PRO_AI_BASE}|g" "$SRC_DIR/AnimeAI.kt"
          sed -i "s|__MODEL__|${PRO_AI_MODEL}|g" "$SRC_DIR/AnimeAI.kt"

          # ── 3) Pantalla de Ajustes Pro / Dev ─────────────────────
          cat > "$SRC_DIR/ProSettingsActivity.kt" <<'EOF'
          package __PKG__

          import android.os.Bundle
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.Switch
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity

          class ProSettingsActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  title = "L.E.B-M Pro"

                  val ll = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 48, 48, 48)
                  }

                  fun header(t: String): TextView = TextView(this).apply {
                      text = t
                      textSize = 18f
                      setPadding(0, 32, 0, 12)
                  }

                  ll.addView(TextView(this).apply {
                      text = "L.E.B-M 1.5-beta · Edición Pro"
                      textSize = 22f
                  })

                  // Toggle PRO
                  val swPro = Switch(this).apply {
                      text = "Activar modo Pro (IA + opciones avanzadas)"
                      isChecked = ProPrefs.isPro(this@ProSettingsActivity)
                      setOnCheckedChangeListener { _, v ->
                          ProPrefs.setPro(this@ProSettingsActivity, v)
                          if (!v) ProPrefs.setDev(this@ProSettingsActivity, false)
                      }
                  }
                  ll.addView(swPro)

                  ll.addView(header("🤖 IA Anime (solo Pro)"))
                  ll.addView(TextView(this).apply {
                      text = "Elegí el estilo del asistente IA:\n" +
                             "• Shonen 🔥 — hype, openings épicos\n" +
                             "• Seinen 🌑 — oscuro, atmosférico\n" +
                             "• Slice of Life 🌸 — cálido, acústico"
                  })

                  // Toggle Dev (solo Pro)
                  ll.addView(header("🛠 Opciones de desarrollador (solo Pro)"))
                  val swDev = Switch(this).apply {
                      text = "Habilitar opciones de desarrollador"
                      isChecked = ProPrefs.isDev(this@ProSettingsActivity)
                      isEnabled = ProPrefs.isPro(this@ProSettingsActivity)
                      setOnCheckedChangeListener { _, v ->
                          if (ProPrefs.isPro(this@ProSettingsActivity)) {
                              ProPrefs.setDev(this@ProSettingsActivity, v)
                          }
                      }
                  }
                  ll.addView(swDev)

                  // Refrescar dev si se toca Pro
                  swPro.setOnCheckedChangeListener { _, v ->
                      ProPrefs.setPro(this@ProSettingsActivity, v)
                      if (!v) ProPrefs.setDev(this@ProSettingsActivity, false)
                      swDev.isEnabled = v
                      if (!v) swDev.isChecked = false
                  }

                  setContentView(ScrollView(this).apply { addView(ll) })
              }
          }
          EOF
          sed -i "s|__PKG__|$PKG|g" "$SRC_DIR/ProSettingsActivity.kt"

          # ── 4) Pantalla IA (chat rápido por estilo) ──────────────
          cat > "$SRC_DIR/AnimeAIActivity.kt" <<'EOF'
          package __PKG__

          import android.os.Bundle
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import androidx.lifecycle.lifecycleScope
          import kotlinx.coroutines.launch

          class AnimeAIActivity : AppCompatActivity() {
              private var style = AnimeAI.Style.SHONEN

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  title = "IA Anime · L.E.B Pro"

                  val ll = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 48, 48, 48)
                  }

                  val output = TextView(this).apply {
                      text = "Elegí un estilo y preguntá algo musical 🎧"
                      textSize = 15f
                      setPadding(0, 24, 0, 24)
                  }

                  fun styleBtn(label: String, s: AnimeAI.Style): Button =
                      Button(this).apply {
                          text = label
                          setOnClickListener {
                              style = s
                              output.text = "Estilo: ${s.label}"
                          }
                      }

                  ll.addView(styleBtn("Shonen 🔥", AnimeAI.Style.SHONEN))
                  ll.addView(styleBtn("Seinen 🌑", AnimeAI.Style.SEINEN))
                  ll.addView(styleBtn("Slice of Life 🌸", AnimeAI.Style.SLICE_OF_LIFE))

                  val input = EditText(this).apply {
                      hint = "Ej: recomendame openings para entrenar"
                  }
                  val send = Button(this).apply { text = "Preguntar a la IA" }

                  send.setOnClickListener {
                      val q = input.text.toString().trim()
                      if (q.isEmpty()) return@setOnClickListener
                      output.text = "⏳ Consultando IA (${style.label})..."
                      lifecycleScope.launch {
                          val r = AnimeAI.ask(this@AnimeAIActivity, style, q)
                          output.text = r
                      }
                  }

                  ll.addView(input)
                  ll.addView(send)
                  ll.addView(output)

                  setContentView(ScrollView(this).apply { addView(ll) })
              }
          }
          EOF
          sed -i "s|__PKG__|$PKG|g" "$SRC_DIR/AnimeAIActivity.kt"

          # ── 5) Mejora UI: tema oscuro Pro + strings ─────────────
          cat > "$RES_DIR/values/leb_pro.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="leb_bg">#0B0B12</color>
              <color name="leb_surface">#161624</color>
              <color name="leb_accent">#7C4DFF</color>
              <color name="leb_accent2">#00E5FF</color>
              <color name="leb_text">#F2F2FF</color>
              <color name="leb_text_dim">#9AA0B4</color>

              <string name="leb_pro_title">L.E.B-M Pro</string>
              <string name="leb_ai_title">IA Anime</string>
              <string name="leb_style_shonen">Shonen</string>
              <string name="leb_style_seinen">Seinen</string>
              <string name="leb_style_sol">Slice of Life</string>
          </resources>
          EOF

          # ── 6) Registrar activities en AndroidManifest ──────────
          MANIFEST="$APP_DIR/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            python3 - "$MANIFEST" "$PKG" <<'PY'
          import sys, re
          path, pkg = sys.argv[1], sys.argv[2]
          xml = open(path, encoding="utf-8").read()
          entries = f'''
              <activity android:name="{pkg}.ProSettingsActivity" android:exported="false" />
              <activity android:name="{pkg}.AnimeAIActivity" android:exported="false" />
          '''
          if f"{pkg}.ProSettingsActivity" not in xml:
              xml = xml.replace("</application>", entries + "\n    </application>")
              open(path, "w", encoding="utf-8").write(xml)
              print("Manifest actualizado")
          else:
              print("Manifest ya tenía las activities")
          PY
          else
            echo "WARN: no hay AndroidManifest.xml"
          fi

          # ── 7) BuildConfig: campos IA + permiso INTERNET ────────
          BUILD_GRADLE="$APP_DIR/build.gradle"
          [ -f "$BUILD_GRADLE" ] || BUILD_GRADLE="$APP_DIR/build.gradle.kts"
          python3 - "$BUILD_GRADLE" "$MANIFEST" <<'PY'
          import sys, re, pathlib
          gradle_path, manifest_path = sys.argv[1], sys.argv[2]
          p = pathlib.Path(gradle_path)
          txt = p.read_text(encoding="utf-8")

          # buildConfig = true si es Kotlin DSL o si no existe
          if gradle_path.endswith(".kts"):
              if "buildConfig = true" not in txt:
                  txt = txt.replace("buildFeatures {", "buildFeatures {\n        buildConfig = true")
                  if "buildConfig = true" not in txt:
                      txt = txt.replace("android {", "android {\n    buildFeatures { buildConfig = true }", 1)
          else:
              if "buildConfig true" not in txt:
                  txt = txt.replace("buildFeatures {", "buildFeatures {\n        buildConfig true")
                  if "buildConfig true" not in txt:
                      txt = txt.replace("android {", "android {\n    buildFeatures { buildConfig true }", 1)

          # defaultConfig: campos IA
          token = "${PRO_AI_TOKEN:-}"
          block = f'''
              buildConfigField "String", "PRO_AI_TOKEN", "\\"{token}\\""
              buildConfigField "String", "PRO_AI_MODEL", "\\"meta-llama/Meta-Llama-3.1-8B-Instruct\\""
          '''
          if "PRO_AI_TOKEN" not in txt:
              txt = re.sub(r"(defaultConfig\s*\{)", r"\1" + block, txt, count=1)

          p.write_text(txt, encoding="utf-8")

          # Manifest: permiso INTERNET
          m = pathlib.Path(manifest_path)
          mx = m.read_text(encoding="utf-8")
          if "android.permission.INTERNET" not in mx:
              mx = mx.replace("<application", '<uses-permission android:name="android.permission.INTERNET" />\n    <application', 1)
              m.write_text(mx, encoding="utf-8")
          print("BuildConfig + INTERNET OK")
          PY

          echo "✅ Inyección Pro/IA/UI completada"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          echo "sdk.dir=${ANDROID_HOME}" > "${PROJECT}/local.properties"
          cd "${PROJECT}"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find "${PROJECT}" -path "*/outputs/apk/debug/*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "No se genero el APK"
            find "${PROJECT}" -name "*.apk" || true
            exit 1
          fi
          cp "$APK" "L.E.B-M-1.5-beta.apk"
          ls -lh "L.E.B-M-1.5-beta.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: L.E.B-M-1.5-beta
          path: L.E.B-M-1.5-beta.apk
          if-no-files-found: error
