name: Android
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar el proyecto
        run: |
          if [ -f MusicPlayer.zip ]; then
            mkdir -p leb_src
            unzip -q -o MusicPlayer.zip -d leb_src
            D=$(dirname "$(find leb_src -name settings.gradle | head -n1)")
          else
            D=$(dirname "$(find . -name settings.gradle -not -path './.git/*' | head -n1)")
          fi
          echo "PROJECT=$D" >> $GITHUB_ENV
          echo "Proyecto en: $D"
      - name: Leer la version de la app
        run: |
          V=$(grep -m1 versionName "$PROJECT/app/build.gradle" | sed 's/.*"\(.*\)".*/\1/')
          echo "VERSION=${V:-0}" >> $GITHUB_ENV
          echo "Version: $V"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Compilar
        run: gradle assembleDebug --stacktrace
        working-directory: ${{ env.PROJECT }}
      - run: cp "$PROJECT/app/build/outputs/apk/debug/app-debug.apk" "L.E.B-M-$VERSION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: L.E.B-M-${{ env.VERSION }}
          path: L.E.B-M-${{ env.VERSION }}.apk
