    private fun createSpaceBackgroundView(): View {
        return object : View(this) {
            private val skyPaint = Paint()
            private val starPaint = Paint(Paint.ANTI_ALIAS_FLAG)
            private val planetPaint = Paint(Paint.ANTI_ALIAS_FLAG)
            private val ringPaint = Paint(Paint.ANTI_ALIAS_FLAG)

            override fun onDraw(canvas: Canvas) {
                val w = width.toFloat()
                val hPx = height.toFloat()
                if (w <= 0f || hPx <= 0f) return

                if (!spaceBgEnabled) {
                    canvas.drawColor(BG)
                    return
                }

                skyPaint.shader = LinearGradient(
                    0f, 0f, w * 0.85f, hPx,
                    intArrayOf(
                        Color.parseColor("#070913"),
                        Color.parseColor("#13102B"),
                        Color.parseColor("#09191B"),
                        Color.parseColor("#06070F")
                    ),
                    floatArrayOf(0f, 0.42f, 0.78f, 1f),
                    Shader.TileMode.CLAMP
                )
                canvas.drawRect(0f, 0f, w, hPx, skyPaint)

                var seed = 987654321
                for (i in 0 until 130) {
                    seed = (1103515245 * seed + 12345) and 0x7FFFFFFF
                    val sx = ((seed % 1000) / 1000f) * w
                    seed = (1103515245 * seed + 12345) and 0x7FFFFFFF
                    val sy = ((seed % 1000) / 1000f) * hPx
                    seed = (1103515245 * seed + 12345) and 0x7FFFFFFF
                    val r = 0.8f + ((seed % 24) / 10f)
                    seed = (1103515245 * seed + 12345) and 0x7FFFFFFF
                    starPaint.color = when {
                        i % 7 == 0 -> Color.parseColor("#8CF0B2")
                        i % 4 == 0 -> Color.parseColor("#C7B8FF")
                        else -> Color.WHITE
                    }
                    starPaint.alpha = 90 + (seed % 165)
                    canvas.drawCircle(sx, sy, r, starPaint)
                }

                val px = w * 0.82f
                val py = hPx * 0.16f
                val pr = minOf(w, hPx) * 0.11f
                planetPaint.color = Color.parseColor("#6B4FE0")
                planetPaint.alpha = 155
                canvas.drawCircle(px, py, pr, planetPaint)

                ringPaint.style = Paint.Style.STROKE
                ringPaint.strokeWidth = dpSize(2).toFloat()
                ringPaint.color = Color.parseColor("#1DB954")
                ringPaint.alpha = 145
                canvas.save()
                canvas.rotate(-18f, px, py)
                canvas.drawOval(RectF(px - pr * 1.85f, py - pr * 0.42f, px + pr * 1.85f, py + pr * 0.42f), ringPaint)
                canvas.restore()
            }
        }
    }

    private fun lebLogo(sizeDp: Int = 38): View {
        val size = dpSize(sizeDp)
        return object : View(this) {
            private val bgPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                color = SPOTIFY_GREEN
                style = Paint.Style.FILL
            }
            private val ringPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                color = Color.WHITE
                style = Paint.Style.STROKE
                strokeWidth = dpSize(2).toFloat()
                alpha = 200
            }
            private val textPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                color = Color.BLACK
                textAlign = Paint.Align.CENTER
                typeface = Typeface.create(Typeface.DEFAULT, Typeface.BOLD)
            }

            override fun onDraw(canvas: Canvas) {
                val w = width.toFloat()
                val hPx = height.toFloat()
                val radius = minOf(w, hPx) / 2f
                canvas.drawCircle(w / 2f, hPx / 2f, radius, bgPaint)
                canvas.drawCircle(w / 2f, hPx / 2f, radius - ringPaint.strokeWidth, ringPaint)
                textPaint.textSize = radius * 0.52f
                val y = hPx / 2f - (textPaint.descent() + textPaint.ascent()) / 2f
                canvas.drawText("L.E.B", w / 2f, y, textPaint)
            }
        }.apply {
            layoutParams = LinearLayout.LayoutParams(size, size).apply { rightMargin = dpSize(10) }
        }
    }

    private fun ensureFallbackPlayer(): MediaPlayer {
        fallbackPlayer?.let { return it }
        return MediaPlayer().apply {
            setAudioAttributes(
                AudioAttributes.Builder()
                    .setUsage(AudioAttributes.USAGE_MEDIA)
                    .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                    .build()
            )
            setOnPreparedListener { mp ->
                fallbackPrepared = true
                try {
                    if (Build.VERSION.SDK_INT >= 23) {
                        val p = mp.playbackParams
                        p.speed = rate.coerceIn(0.5f, 2.0f)
                        p.pitch = if (keepPitch) 1.0f else rate.coerceIn(0.5f, 2.0f)
                        mp.playbackParams = p
                    }
                } catch (_: Exception) {}
                try { mp.start() } catch (_: Exception) {}
                fallbackPlaying = true
                syncUi()
            }
            setOnCompletionListener {
                fallbackPlaying = false
                if (repeatMode == 2 && fallbackCurrent != null) {
                    playFallback(fallbackQueue.ifEmpty { listOf(fallbackCurrent!!) }, fallbackIndex.coerceAtLeast(0))
                } else if (fallbackQueue.isNotEmpty()) {
                    val nxt = if (shuffleEnabled) (fallbackQueue.indices).random()
                    else if (fallbackIndex + 1 < fallbackQueue.size) fallbackIndex + 1
                    else if (repeatMode == 1) 0 else -1
                    if (nxt >= 0) playFallback(fallbackQueue, nxt) else syncUi()
                } else {
                    syncUi()
                }
            }
            setOnErrorListener { _, _, _ ->
                fallbackPrepared = false
                fallbackPlaying = false
                syncUi()
                true
            }
            fallbackPlayer = this
        }
    }

    private fun playFallback(list: List<Song>, idx: Int) {
        if (list.isEmpty()) return
        val safe = idx.coerceIn(0, list.lastIndex)
        fallbackQueue = list
        fallbackIndex = safe
        val target = list[safe]
        fallbackCurrent = target
        currentLyricIndex = -1
        try {
            fullPlayer.visibility = View.VISIBLE
            startBgAnimation()
        } catch (_: Exception) {}
        syncUi()
        try {
            val mp = ensureFallbackPlayer()
            fallbackPrepared = false
            fallbackPlaying = false
            mp.reset()
            mp.setDataSource(this, target.uri)
            mp.prepareAsync()
        } catch (_: Exception) {
            Toast.makeText(this, "No se pudo abrir la pista", Toast.LENGTH_SHORT).show()
        }
    }

    override fun onCreate(b: Bundle?) {
        super.onCreate(b)
        Thread.setDefaultUncaughtExceptionHandler { _, _ ->
            try {
                runOnUiThread {
                    Toast.makeText(this@MainActivity, "Se evito cerrar L.E.B-M", Toast.LENGTH_SHORT).show()
                }
            } catch (_: Exception) {}
        }
        loadSavedPrefs()
        try {
            val root = FrameLayout(this).apply { setBackgroundColor(BG) }
            spaceCanvasView = createSpaceBackgroundView()
            root.addView(spaceCanvasView, FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT))
            root.addView(buildMain())
            root.addView(buildFull())
            root.addView(buildSettings())
            setContentView(root)
            refresh()
        } catch (_: Exception) {}

        val perms = if (Build.VERSION.SDK_INT >= 33)
            arrayOf(Manifest.permission.READ_MEDIA_AUDIO, Manifest.permission.POST_NOTIFICATIONS)
        else
            arrayOf(Manifest.permission.READ_EXTERNAL_STORAGE)

        if (hasAudioPerm()) scan()
        if (perms.any { checkSelfPermission(it) != PackageManager.PERMISSION_GRANTED }) {
            try {
                requestPermissions(perms, 1)
            } catch (_: Exception) {}
        }
        connect()
        tick()
    }

    private fun hasAudioPerm() =
        checkSelfPermission(
            if (Build.VERSION.SDK_INT >= 33) Manifest.permission.READ_MEDIA_AUDIO
            else Manifest.permission.READ_EXTERNAL_STORAGE
        ) == PackageManager.PERMISSION_GRANTED

    override fun onRequestPermissionsResult(c: Int, p: Array<out String>, r: IntArray) {
        try {
            super.onRequestPermissionsResult(c, p, r)
        } catch (_: Exception) {}
        if (hasAudioPerm()) scan()
        else {
            refresh()
            Toast.makeText(this, "Necesito permiso para ver tu musica", Toast.LENGTH_LONG).show()
        }
    }

    private val listener = object : Player.Listener {
        override fun onMediaItemTransition(m: MediaItem?, r: Int) {
            currentLyricIndex = -1
            syncUi()
        }
        override fun onIsPlayingChanged(p: Boolean) { syncUi() }
        override fun onPlaybackStateChanged(s: Int) { syncUi() }
    }

    private fun connect() {
        try {
            val token = SessionToken(this, ComponentName(this, PlaybackService::class.java))
            val f = MediaController.Builder(this, token).buildAsync()
            f.addListener({
                try {
                    ctrl = f.get()
                    ctrl?.addListener(listener)
                    syncUi()
                } catch (_: Exception) {}
            }, Executor { cmd -> mainHandler.post { try { cmd.run() } catch (_: Exception) {} } })
        } catch (_: Exception) {}
    }

    private fun artUri(s: Song) =
        ContentUris.withAppendedId(Uri.parse("content://media/external/audio/albumart"), s.albumId)

    private fun item(s: Song) = MediaItem.Builder()
        .setMediaId(s.id.toString())
        .setUri(s.uri)
        .setMediaMetadata(
            MediaMetadata.Builder()
                .setTitle(s.title)
                .setArtist(s.artist)
                .setAlbumTitle(s.album)
                .setArtworkUri(artUri(s))
                .build()
        )
        .build()

    private fun playList(l: List<Song>, i: Int) {
        if (l.isEmpty()) return
        val safe = i.coerceIn(0, l.lastIndex)
        val c = ctrl
        if (c != null) {
            try {
                fallbackPlayer?.let { if (it.isPlaying) it.pause() }
                fallbackPlaying = false
                c.setMediaItems(l.map { item(it) }, safe, 0L)
                c.prepare()
                c.play()
                applySpeed()
                fullPlayer.visibility = View.VISIBLE
                startBgAnimation()
                return
            } catch (_: Exception) {}
        }
        playFallback(l, safe)
    }

    private fun current(): Song? {
        val id = ctrl?.currentMediaItem?.mediaId
        if (id != null) {
            songs.find { it.id.toString() == id }?.let { return it }
            onlineSongs.find { it.id.toString() == id }?.let { return it }
        }
        return fallbackCurrent
    }

    private fun applySpeed() {
        try {
            ctrl?.setPlaybackParameters(PlaybackParameters(rate, if (keepPitch) 1f else rate))
        } catch (_: Exception) {}
        try {
            if (Build.VERSION.SDK_INT >= 23 && fallbackPrepared) {
                fallbackPlayer?.let { mp ->
                    val p = mp.playbackParams
                    p.speed = rate.coerceIn(0.5f, 2.0f)
                    p.pitch = if (keepPitch) 1.0f else rate.coerceIn(0.5f, 2.0f)
                    mp.playbackParams = p
                }
            }
        } catch (_: Exception) {}
    }

    private fun scan() {
        songs.clear()
        try {
            val base = MediaStore.Audio.Media.EXTERNAL_CONTENT_URI
            contentResolver.query(
                base,
                arrayOf(AM._ID, AM.TITLE, AM.ARTIST, AM.ALBUM, AM.ALBUM_ID),
                "${AM.IS_MUSIC}!=0 AND ${AM.DURATION}>=15000",
                null,
                "${AM.TITLE} COLLATE NOCASE ASC"
            )?.use { c ->
                while (c.moveToNext()) {
                    val artist = c.getString(2)?.takeIf { it != "<unknown>" } ?: "Artista desconocido"
                    songs.add(
                        Song(
                            c.getLong(0),
                            c.getString(1) ?: "Sin titulo",
                            artist,
                            c.getString(3) ?: "Album desconocido",
                            c.getLong(4),
                            ContentUris.withAppendedId(base, c.getLong(0)),
                            false
                        )
                    )
                }
            }
        } catch (_: Exception) {}
        refresh()
    }

    private fun unescapeJson(raw: String): String {
        return raw.replace("\\u0026", "&")
            .replace("\\/", "/")
            .replace("\\\"", "\"")
            .replace("\\n", " ")
    }

    private fun searchOnlineMusic(term: String) {
        val clean = term.trim()
        if (clean.isEmpty()) return
        Toast.makeText(this, "Buscando musica: $clean...", Toast.LENGTH_SHORT).show()
        Thread {
            val found = ArrayList<Song>()
            try {
                val encoded = URLEncoder.encode(clean, "UTF-8")
                val url = URL("https://itunes.apple.com/search?term=$encoded&media=music&entity=song&limit=25")
                val conn = (url.openConnection() as HttpURLConnection).apply {
                    requestMethod = "GET"
                    connectTimeout = 7000
                    readTimeout = 7000
                }
                val body = BufferedReader(InputStreamReader(conn.inputStream)).use { it.readText() }
                conn.disconnect()

                val trackRegex = Regex("\"trackId\"\\s*:\\s*(\\d+).*?\"artistName\"\\s*:\\s*\"([^\"]*)\".*?\"trackName\"\\s*:\\s*\"([^\"]*)\".*?\"collectionName\"\\s*:\\s*\"([^\"]*)\".*?\"previewUrl\"\\s*:\\s*\"([^\"]*)\"")
                for (m in trackRegex.findAll(body)) {
                    val tid = m.groupValues[1].toLongOrNull() ?: continue
                    val artist = unescapeJson(m.groupValues[2])
                    val title = unescapeJson(m.groupValues[3])
                    val album = unescapeJson(m.groupValues[4])
                    val preview = m.groupValues[5].replace("\\/", "/")
                    if (preview.startsWith("http")) {
                        found.add(
                            Song(
                                id = -tid,
                                title = title,
                                artist = artist,
                                album = album,
                                albumId = 0L,
                                uri = Uri.parse(preview),
                                isOnline = true
                            )
                        )
                    }
                }
            } catch (_: Exception) {}

            runOnUiThread {
                onlineSongs.clear()
                onlineSongs.addAll(found)
                currentTab = 4
                refresh()
                if (found.isEmpty()) {
                    Toast.makeText(this@MainActivity, "Sin resultados en linea para \"$clean\"", Toast.LENGTH_SHORT).show()
                } else {
                    Toast.makeText(this@MainActivity, "${found.size} pistas encontradas", Toast.LENGTH_SHORT).show()
                }
            }
        }.start()
    }

    private fun favs(): MutableSet<String> =
        try { HashSet(prefs.getStringSet("fav", emptySet()) ?: emptySet()) } catch (_: Exception) { HashSet() }

    private fun isFav(s: Song?) = s != null && favs().contains(s.id.toString())

    private fun toggleFav(s: Song?) {
        if (s == null) return
        val set = favs()
        if (!set.remove(s.id.toString())) set.add(s.id.toString())
        prefs.edit().putStringSet("fav", set).apply()
        syncUi()
        if (currentTab == 3) refresh() else songListView.invalidateViews()
    }

    private fun refresh() {
        if (!::tabs.isInitialized || !::songListView.isInitialized) return
        tabs.forEachIndexed { idx, b ->
            b.setTextColor(if (idx == currentTab) SPOTIFY_GREEN else GRAY)
        }
        backButton.visibility = if (filterKind.isEmpty()) View.GONE else View.VISIBLE
        backButton.text = "< Volver - $filterValue"

        val q = query.trim()
        fun songRows(l: List<Song>) = l.mapIndexed { idx, s ->
            val tag = if (s.isOnline) " - Web" else ""
            Row(
                t = s.title,
                s = s.artist + tag + if (isFav(s)) " *Fav" else "",
                song = s,
                long = { toggleFav(s) },
                click = { playList(l, idx) }
            )
        }

        val combined = songs + onlineSongs
        rows = when {
            currentTab == 1 && filterKind.isEmpty() ->
                songs.groupBy { it.artist }.map { (k, v) ->
                    Row(k, "${v.size} canciones") { filterKind = "a"; filterValue = k; currentTab = 0; refresh() }
                }
            currentTab == 2 && filterKind.isEmpty() ->
                songs.groupBy { it.album }.map { (k, v) ->
                    Row(k, "${v.first().artist} - ${v.size} canciones", v.first()) { filterKind = "b"; filterValue = k; currentTab = 0; refresh() }
                }
            currentTab == 3 -> songRows(combined.filter { isFav(it) })
            currentTab == 4 -> songRows(onlineSongs.filter {
                q.isEmpty() || it.title.contains(q, true) || it.artist.contains(q, true)
            })
            else -> songRows(songs.filter { s ->
                val kwOk = !autoFilterMiApp || lyricKeyword.isBlank() ||
                    s.title.contains(lyricKeyword, true) || s.artist.contains(lyricKeyword, true) || s.album.contains(lyricKeyword, true)
                val fOk = filterKind.isEmpty() || (filterKind == "a" && s.artist == filterValue) || (filterKind == "b" && s.album == filterValue)
                val qOk = q.isEmpty() || s.title.contains(q, true) || s.artist.contains(q, true)
                kwOk && fOk && qOk
            })
        }

        songListView.adapter = object : BaseAdapter() {
            override fun getCount() = rows.size
            override fun getItem(p: Int) = rows[p]
            override fun getItemId(p: Int) = p.toLong()
            override fun getView(p: Int, cv: View?, parent: ViewGroup): View {
                val r = rows[p]
                val row = (cv as? LinearLayout) ?: LinearLayout(this@MainActivity).apply {
                    gravity = Gravity.CENTER_VERTICAL
                    setPadding(dpSize(16), dpSize(7), dpSize(16), dpSize(7))
                    addView(ImageView(this@MainActivity).apply {
                        scaleType = ImageView.ScaleType.CENTER_CROP
                        background = rounded(CARD, 10)
                        clipToOutline = true
                        outlineProvider = ViewOutlineProvider.BACKGROUND
                    }, LinearLayout.LayoutParams(dpSize(54), dpSize(54)))
                    addView(LinearLayout(this@MainActivity).apply {
                        orientation = LinearLayout.VERTICAL
                        setPadding(dpSize(12), 0, 0, 0)
                        addView(makeText("", 15f, Color.WHITE, true))
                        addView(makeText("", 12f, GRAY))
                    }, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                }
                val iv = row.getChildAt(0) as ImageView
                val col = row.getChildAt(1) as LinearLayout
                val tv1 = col.getChildAt(0) as TextView
                val tv2 = col.getChildAt(1) as TextView
                tv1.text = r.t
                tv1.setTextColor(if (r.song != null && r.song.id == current()?.id) SPOTIFY_GREEN else Color.WHITE)
                tv2.text = r.s
                iv.setImageDrawable(null)
                iv.tag = null
                r.song?.let { if (!it.isOnline) thumb(it, iv, 160) }
                row.setOnClickListener { r.click() }
                row.setOnLongClickListener { r.long?.invoke(); r.long != null }
                return row
            }
        }
    }

    private fun thumb(s: Song, iv: ImageView, px: Int) {
        val key = "${s.uri}_$px"
        iv.tag = key
        cache.get(key)?.let { iv.setImageBitmap(it); return }
        if (Build.VERSION.SDK_INT < 29) return
        Thread {
            try {
                val bm = contentResolver.loadThumbnail(s.uri, Size(px, px), null)
                cache.put(key, bm)
                runOnUiThread { if (iv.tag == key) iv.setImageBitmap(bm) }
            } catch (_: Exception) {}
        }.start()
    }

