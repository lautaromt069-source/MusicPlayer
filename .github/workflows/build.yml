name: Build L.E.B-M Anime APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create L.E.B-M Anime Android project
        run: |
          rm -rf anime_app
          mkdir -p anime_app/app/src/main/java/com/leb/anime \
                   anime_app/app/src/main/res/layout \
                   anime_app/app/src/main/res/values \
                   anime_app/app/src/main/res/mipmap-mdpi \
                   anime_app/app/src/main/res/mipmap-hdpi \
                   anime_app/app/src/main/res/mipmap-xhdpi \
                   anime_app/app/src/main/res/mipmap-xxhdpi \
                   anime_app/app/src/main/res/mipmap-xxxhdpi

          cat << 'EOF' > anime_app/settings.gradle
          rootProject.name = "LEBMAnime"
          include(":app")
          EOF

          cat << 'EOF' > anime_app/gradle.properties
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF

          cat << 'EOF' > anime_app/app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.leb.anime'
              compileSdk 34

              defaultConfig {
                  applicationId "com.leb.anime"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.13.1'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
          }
          EOF

          cat << 'EOF' > anime_app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.Material3.Dark.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > anime_app/app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">L.E.B-M Anime</string>
              <string name="search_hint">Buscar cualquier anime...</string>
              <string name="offline_msg">Sin Internet: mostrando catálogo guardado</string>
          </resources>
          EOF

          cat << 'EOF' > anime_app/app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#0D1117"
              android:orientation="vertical"
              android:padding="16dp">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="L.E.B-M ANIME"
                  android:textColor="#38BDF8"
                  android:textSize="22sp"
                  android:textStyle="bold" />

              <TextView
                  android:id="@+id/tvStatus"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="4dp"
                  android:text="Catálogo listo"
                  android:textColor="#94A3B8"
                  android:textSize="13sp" />

              <EditText
                  android:id="@+id/etSearch"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="12dp"
                  android:backgroundTint="#38BDF8"
                  android:hint="@string/search_hint"
                  android:inputType="text"
                  android:textColor="#FFFFFF"
                  android:textColorHint="#64748B" />

              <androidx.recyclerview.widget.RecyclerView
                  android:id="@+id/rvAnime"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_marginTop="12dp"
                  android:layout_weight="1" />
          </LinearLayout>
          EOF

          cat << 'EOF' > anime_app/app/src/main/res/layout/item_anime.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:layout_marginBottom="10dp"
              android:background="#161B22"
              android:orientation="vertical"
              android:padding="14dp">

              <TextView
                  android:id="@+id/tvTitle"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:textColor="#F8FAFC"
                  android:textSize="16sp"
                  android:textStyle="bold" />

              <TextView
                  android:id="@+id/tvMeta"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="4dp"
                  android:textColor="#38BDF8"
                  android:textSize="12sp" />

              <TextView
                  android:id="@+id/tvSynopsis"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="6dp"
                  android:maxLines="3"
                  android:textColor="#CBD5E1"
                  android:textSize="13sp" />
          </LinearLayout>
          EOF

          cat << 'EOF' > anime_app/app/src/main/java/com/leb/anime/MainActivity.kt
          package com.leb.anime

          import android.content.Context
          import android.content.Intent
          import android.net.ConnectivityManager
          import android.net.NetworkCapabilities
          import android.net.Uri
          import android.os.Bundle
          import android.text.Editable
          import android.text.TextWatcher
          import android.view.LayoutInflater
          import android.view.View
          import android.view.ViewGroup
          import android.widget.EditText
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import androidx.recyclerview.widget.LinearLayoutManager
          import androidx.recyclerview.widget.RecyclerView
          import org.json.JSONArray
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder
          import kotlin.concurrent.thread

          data class AnimeItem(
              val title: String,
              val episodes: String,
              val score: String,
              val synopsis: String,
              val url: String
          )

          class MainActivity : AppCompatActivity() {

              private lateinit var adapter: AnimeAdapter
              private val items = mutableListOf<AnimeItem>()

              private val fallbackCatalog = listOf(
                  AnimeItem("Attack on Titan", "87 eps", "9.0", "La humanidad lucha tras murallas contra titanes.", "https://myanimelist.net/anime/16498"),
                  AnimeItem("Jujutsu Kaisen", "47 eps", "8.6", "Un estudiante se une a hechiceros para combatir maldiciones.", "https://myanimelist.net/anime/40748"),
                  AnimeItem("Demon Slayer", "55 eps", "8.5", "Tanjiro busca una cura para su hermana convertida en demonio.", "https://myanimelist.net/anime/38000"),
                  AnimeItem("Frieren: Beyond Journey's End", "28 eps", "9.3", "Una elfa maga reflexiona sobre el tiempo y la memoria tras una gran gesta.", "https://myanimelist.net/anime/52991"),
                  AnimeItem("One Piece", "1100+ eps", "8.7", "Luffy y su tripulación navegan en busca del tesoro One Piece.", "https://myanimelist.net/anime/21")
              )

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  val tvStatus = findViewById<TextView>(R.id.tvStatus)
                  val etSearch = findViewById<EditText>(R.id.etSearch)
                  val rvAnime = findViewById<RecyclerView>(R.id.rvAnime)

                  adapter = AnimeAdapter(items) { anime ->
                      try {
                          startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(anime.url)))
                      } catch (_: Exception) { }
                  }
                  rvAnime.layoutManager = LinearLayoutManager(this)
                  rvAnime.adapter = adapter

                  setItems(fallbackCatalog)
                  if (!isOnline()) {
                      tvStatus.text = getString(R.string.offline_msg)
                  } else {
                      tvStatus.text = "Catálogo en línea (Jikan / MyAnimeList)"
                      fetchAnime("")
                  }

                  etSearch.addTextChangedListener(object : TextWatcher {
                      override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}
                      override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) {}
                      override fun afterTextChanged(s: Editable?) {
                          val query = s?.toString()?.trim().orEmpty()
                          if (!isOnline()) {
                              val filtered = fallbackCatalog.filter {
                                  it.title.contains(query, ignoreCase = true)
                              }
                              setItems(if (query.isEmpty()) fallbackCatalog else filtered)
                          } else {
                              fetchAnime(query)
                          }
                      }
                  })
              }

              private fun setItems(newList: List<AnimeItem>) {
                  items.clear()
                  items.addAll(newList)
                  adapter.notifyDataSetChanged()
              }

              private fun fetchAnime(query: String) {
                  thread {
                      try {
                          val endpoint = if (query.isEmpty()) {
                              "https://api.jikan.moe/v4/top/anime?limit=20"
                          } else {
                              val encoded = URLEncoder.encode(query, "UTF-8")
                              "https://api.jikan.moe/v4/anime?q=$encoded&limit=20"
                          }
                          val conn = (URL(endpoint).openConnection() as HttpURLConnection).apply {
                              connectTimeout = 7000
                              readTimeout = 7000
                              requestMethod = "GET"
                          }
                          if (conn.responseCode == 200) {
                              val body = conn.inputStream.bufferedReader().use { it.readText() }
                              val root = org.json.JSONObject(body)
                              val data = root.optJSONArray("data") ?: JSONArray()
                              val parsed = mutableListOf<AnimeItem>()
                              for (i in 0 until data.length()) {
                                  val obj = data.optJSONObject(i) ?: continue
                                  val title = obj.optString("title", "Sin título")
                                  val eps = obj.optInt("episodes", 0)
                                  val epText = if (eps > 0) "$eps eps" else "En emisión"
                                  val scoreVal = obj.optDouble("score", 0.0)
                                  val scoreText = if (scoreVal > 0.0) "★ $scoreVal" else "Sin puntaje"
                                  val synopsis = obj.optString("synopsis", "Sin sinopsis disponible.")
                                  val url = obj.optString("url", "https://myanimelist.net")
                                  parsed.add(AnimeItem(title, epText, scoreText, synopsis, url))
                              }
                              runOnUiThread {
                                  if (!isFinishing && !isDestroyed && parsed.isNotEmpty()) {
                                      setItems(parsed)
                                  }
                              }
                          }
                          conn.disconnect()
                      } catch (_: Exception) {
                          runOnUiThread {
                              if (!isFinishing && !isDestroyed && items.isEmpty()) {
                                  setItems(fallbackCatalog)
                              }
                          }
                      }
                  }
              }

              private fun isOnline(): Boolean {
                  val cm = getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                  val net = cm.activeNetwork ?: return false
                  val caps = cm.getNetworkCapabilities(net) ?: return false
                  return caps.hasCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET)
              }
          }

          class AnimeAdapter(
              private val list: List<AnimeItem>,
              private val onClick: (AnimeItem) -> Unit
          ) : RecyclerView.Adapter<AnimeAdapter.VH>() {

              class VH(view: View) : RecyclerView.ViewHolder(view) {
                  val tvTitle: TextView = view.findViewById(R.id.tvTitle)
                  val tvMeta: TextView = view.findViewById(R.id.tvMeta)
                  val tvSynopsis: TextView = view.findViewById(R.id.tvSynopsis)
              }

              override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
                  val v = LayoutInflater.from(parent.context).inflate(R.layout.item_anime, parent, false)
                  return VH(v)
              }

              override fun onBindViewHolder(holder: VH, position: Int) {
                  val item = list[position]
                  holder.tvTitle.text = item.title
                  holder.tvMeta.text = "${item.episodes}  •  ${item.score}"
                  holder.tvSynopsis.text = item.synopsis
                  holder.itemView.setOnClickListener { onClick(item) }
              }

              override fun getItemCount(): Int = list.size
          }
          EOF

          python3 - << 'EOF'
          import os, struct, zlib
          def png(s):
              def ch(t, d): return struct.pack("!I", len(d)) + t + d + struct.pack("!I", zlib.crc32(t + d) & 0xFFFFFFFF)
              raw = (bytes([0]) + bytes([56, 189, 248, 255]) * s) * s
              return b"\x89PNG\r\n\x1a\n" + ch(b"IHDR", struct.pack("!IIBBBBB", s, s, 8, 6, 0, 0, 0)) + ch(b"IDAT", zlib.compress(raw)) + ch(b"IEND", b"")
          for d, px in {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}.items():
              p = f"anime_app/app/src/main/res/mipmap-{d}"
              for n in ("ic_launcher.png", "ic_launcher_round.png"):
                  with open(f"{p}/{n}", "wb") as f: f.write(png(px))
          EOF

          ls -la anime_app/app/src/main/java/com/leb/anime

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - run: gradle assembleDebug
        working-directory: anime_app

      - run: cp anime_app/app/build/outputs/apk/debug/app-debug.apk L.E.B-M-Anime-v1.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: L.E.B-M-Anime-v1.0
          path: L.E.B-M-Anime-v1.0.apk
