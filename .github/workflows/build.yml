name: Build L.E.B-M v1.3 APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate Android project
        run: |
          if [ -f MusicPlayer.zip ]; then
            mkdir -p leb_src
            unzip -q -o MusicPlayer.zip -d leb_src
            D=$(dirname "$(find leb_src \( -name settings.gradle -o -name settings.gradle.kts \) | head -n1)")
          else
            D=$(dirname "$(find . \( -name settings.gradle -o -name settings.gradle.kts \) -not -path './.git/*' | head -n1)")
          fi
          echo "PROJECT=$D" >> $GITHUB_ENV

      - name: Set version 1.3 and app name
        run: |
          GRADLE_FILE=$(find "$PROJECT/app" -maxdepth 1 \( -name "build.gradle" -o -name "build.gradle.kts" \) | head -n1)
          if [ -n "$GRADLE_FILE" ]; then
            sed -i 's/versionName "[^"]*"/versionName "1.3"/g; s/versionName = "[^"]*"/versionName = "1.3"/g' "$GRADLE_FILE"
            sed -i 's/versionCode [0-9]\+/versionCode 13/g; s/versionCode = [0-9]\+/versionCode = 13/g' "$GRADLE_FILE"
          fi

      - name: Generate launcher icon and L.E.B-M logo
        run: |
          RES_DIR="$PROJECT/app/src/main/res"
          python3 -c '
          import os, struct, zlib, math

          def make_icon_png(size, mode="launcher"):
              def chunk(tag, data):
                  return (
                      struct.pack("!I", len(data))
                      + tag
                      + data
                      + struct.pack("!I", zlib.crc32(tag + data) & 0xFFFFFFFF)
                  )
              cx, cy = (size - 1) / 2.0, (size - 1) / 2.0
              r_outer = size * 0.44
              r_inner = size * 0.22
              rows = []
              for y in range(size):
                  row = bytearray([0])
                  for x in range(size):
                      dx, dy = x - cx, y - cy
                      dist = math.hypot(dx, dy)
                      if mode == "launcher":
                          # Fondo oscuro con anillo esmeralda/turquesa y núcleo luminoso
                          if dist <= r_outer:
                              if dist <= r_inner:
                                  r, g, b, a = 16, 22, 34, 255
                              else:
                                  t = (x + y) / max(1, 2 * size)
                                  r = int(16 + 24 * t)
                                  g = int(185 + 55 * (1 - t))
                                  b = int(145 + 85 * t)
                                  a = 255
                          else:
                              r, g, b, a = 12, 16, 24, 255
                      else:
                          # Logo L.E.B-M: círculo degradado naturaleza + centro brillante
                          if dist <= r_outer:
                              t = dist / max(1.0, r_outer)
                              r = int(20 + 40 * t)
                              g = int(210 - 60 * t)
                              b = int(150 + 70 * (1 - t))
                              a = 255
                          else:
                              r, g, b, a = 0, 0, 0, 0
                      row.extend((max(0, min(255, r)), max(0, min(255, g)), max(0, min(255, b)), max(0, min(255, a))))
                  rows.append(bytes(row))
              raw = b"".join(rows)
              ihdr = struct.pack("!IIBBBBB", size, size, 8, 6, 0, 0, 0)
              return (
                  b"\x89PNG\r\n\x1a\n"
                  + chunk(b"IHDR", ihdr)
                  + chunk(b"IDAT", zlib.compress(raw, level=9))
                  + chunk(b"IEND", b"")
              )

          sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          for d, s in sizes.items():
              p = f"'"$RES_DIR"'/mipmap-{d}"
              os.makedirs(p, exist_ok=True)
              if not os.path.exists(f"{p}/ic_launcher.png"):
                  with open(f"{p}/ic_launcher.png", "wb") as f:
                      f.write(make_icon_png(s, "launcher"))
              if not os.path.exists(f"{p}/ic_launcher_round.png"):
                  with open(f"{p}/ic_launcher_round.png", "wb") as f:
                      f.write(make_icon_png(s, "launcher"))

          os.makedirs(f"'"$RES_DIR"'/drawable", exist_ok=True)
          with open(f"'"$RES_DIR"'/drawable/leb_m_logo.png", "wb") as f:
              f.write(make_icon_png(256, "logo"))
          '

      - name: Ensure safe bilingual strings and credits
        run: |
          RES_DIR="$PROJECT/app/src/main/res"
          mkdir -p "$RES_DIR/values" "$RES_DIR/values-es"

          cat << 'EOF' > "$RES_DIR/values/strings.xml"
          <resources>
              <string name="app_name">L.E.B-M</string>
              <string name="created_by">Created by Lautaro and Claude</string>
              <string name="intro_nature">Nature mode loading...</string>
              <string name="search_hint">Search song (YouTube / Spotify / Local)</string>
              <string name="offline_banner">Offline mode: showing local/cached library</string>
              <string name="online_banner">Online mode: YouTube &amp; Spotify search ready</string>
              <string name="source_all">All</string>
              <string name="source_youtube">YouTube</string>
              <string name="source_spotify">Spotify</string>
              <string name="source_local">Local</string>
              <string name="lang_toggle">ES / EN</string>
          </resources>
          EOF

          cat << 'EOF' > "$RES_DIR/values-es/strings.xml"
          <resources>
              <string name="app_name">L.E.B-M</string>
              <string name="created_by">Creado por Lautaro y Claude</string>
              <string name="intro_nature">Cargando escena de naturaleza...</string>
              <string name="search_hint">Buscar canción (YouTube / Spotify / Local)</string>
              <string name="offline_banner">Sin Internet: modo local / caché activado</string>
              <string name="online_banner">Con Internet: búsqueda YouTube y Spotify lista</string>
              <string name="source_all">Todo</string>
              <string name="source_youtube">YouTube</string>
              <string name="source_spotify">Spotify</string>
              <string name="source_local">Local</string>
              <string name="lang_toggle">ES / EN</string>
          </resources>
          EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - run: gradle assembleDebug
        working-directory: ${{ env.PROJECT }}

      - run: cp "$PROJECT/app/build/outputs/apk/debug/app-debug.apk" L.E.B-M-v1.3.apk

      - uses: actions/upload-artifact@v4
        with:
          name: L.E.B-M-v1.3
          path: L.E.B-M-v1.3.apk
