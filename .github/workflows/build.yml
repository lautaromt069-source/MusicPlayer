name: Build L.E.B-M 1.6-beta

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project and locate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "MusicPlayer.zip" ]; then
            echo "Descomprimiendo MusicPlayer.zip..."
            unzip -q -o "MusicPlayer.zip" -d ./unpacked
          fi

          PROJECT=""
          for candidate in "." "./unpacked" "./MusicPlayer" "./leb" \
                           "./unpacked/MusicPlayer" "./MusicPlayer/MusicPlayer"; do
            if [ -f "$candidate/settings.gradle" ] || \
               [ -f "$candidate/settings.gradle.kts" ]; then
              PROJECT="$candidate"
              break
            fi
          done

          if [ -z "$PROJECT" ]; then
            FOUND="$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path '*/.git/*' -not -path '*/.gradle/*' | head -n 1 || true)"
            if [ -n "$FOUND" ]; then
              PROJECT="$(dirname "$FOUND")"
            fi
          fi

          if [ -z "$PROJECT" ]; then
            echo "::error::No se encontró settings.gradle ni settings.gradle.kts."
            echo "Comprueba que MusicPlayer.zip contiene un proyecto Android completo."
            find . -maxdepth 5 -type f | head -100
            exit 1
          fi

          PROJECT="$(cd "$PROJECT" && pwd)"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Proyecto encontrado: $PROJECT"
          ls -la "$PROJECT"

          if [ ! -d "$PROJECT/app" ]; then
            echo "::error::No se encontró la carpeta app dentro del proyecto."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Collect and verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT/app/build/outputs/apk" \
            -type f -name '*.apk' | sort | head -n 1 || true)"

          if [ -z "$APK" ]; then
            echo "::error::La compilación terminó, pero no se encontró ningún APK."
            find "$PROJECT" -type f -name '*.apk' || true
            exit 1
          fi

          cp "$APK" "L.E.B-M-1.6-beta.apk"
          unzip -t "L.E.B-M-1.6-beta.apk"
          echo "APK listo:"
          ls -lh "L.E.B-M-1.6-beta.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: L.E.B-M-1.6-beta
          path: L.E.B-M-1.6-beta.apk
          if-no-files-found: error
          retention-days: 14
