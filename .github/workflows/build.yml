name: Build L.E.B-M 1.5-beta

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project
        shell: bash
        run: |
          set -e
          if [ -f MusicPlayer.zip ]; then
            unzip -q -o MusicPlayer.zip
          fi
          if [ -f ./settings.gradle ]; then
            PROJECT="."
          elif [ -f ./MusicPlayer/settings.gradle ]; then
            PROJECT="./MusicPlayer"
          elif [ -f ./leb/settings.gradle ]; then
            PROJECT="./leb"
          else
            FOUND=$(find . -name settings.gradle | grep -v "/\.git/" | head -n 1 || true)
            if [ -z "$FOUND" ]; then
              echo "No se encontro settings.gradle"
              find . -maxdepth 4 -type f | head -50
              exit 1
            fi
            PROJECT=$(dirname "$FOUND")
          fi
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Proyecto en: $PROJECT"

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK (manual)
        shell: bash
        run: |
          set -e
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$SDK/cmdline-tools"
          rm -rf "$SDK/cmdline-tools/latest"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Accept licenses and install platforms
        shell: bash
        run: |
          set -e
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        shell: bash
        run: |
          set -e
          echo "sdk.dir=$ANDROID_HOME" > "$PROJECT/local.properties"
          gradle assembleDebug --stacktrace
        working-directory: ${{ env.PROJECT }}

      - name: Copy APK
        shell: bash
        run: cp "${PROJECT}/app/build/outputs/apk/debug/app-debug.apk" L.E.B-M-1.5-beta.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: L.E.B-M-1.5-beta
          path: L.E.B-M-1.5-beta.apk
          if-no-files-found: error
