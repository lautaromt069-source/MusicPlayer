                      <EditText
                          android:id="@+id/etCustomAiPersonality"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:hint="Personalidad de tu IA (ej. mentor calmado, cyber guía)"
                          android:textColor="#FFFFFF"
                          android:textColorHint="#B39DDB"
                          android:paddingBottom="8dp" />

                      <Button
                          android:id="@+id/btnSaveCustomAi"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="Guardar mi IA personalizada"
                          android:layout_marginBottom="10dp" />

                      <EditText
                          android:id="@+id/etAnimePrompt"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:hint="Escribe un mood o actividad para consultar la IA"
                          android:textColor="#FFFFFF"
                          android:textColorHint="#B39DDB"
                          android:paddingBottom="8dp" />

                      <Button
                          android:id="@+id/btnAskAnimeAi"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="Consultar IA (Pro+)" />

                      <TextView
